<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>以琴探長：注音破案記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#24495B; --desk2:#1B3847; --deskline:#2F5A6E;
  --kraft:#D9B57A; --kraft2:#B98E4E; --paper:#FFF9E4; --paper2:#F6EDCC;
  --grid:#8FC4A5; --gridsoft:#CFE6D7; --ink:#2A2724; --ink2:#5E5548;
  --stamp:#C8342B; --amber:#EA9A3B; --amber2:#B96F1C; --good:#2F8F57; --goodbg:#DFF2E3;
  --hl:#FFE08A; --onDesk:#F5EBD3; --shadow:0 3px 0 rgba(0,0,0,.18);
  --font:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","STKaiti","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#14303D; --desk2:#0F2530; --deskline:#1D4052; --paper:#F1E7C6; --paper2:#E6DAB2;
    --kraft:#C7A267; --kraft2:#A07A3E; --onDesk:#EDE2C6;
  }
}
:root[data-theme="dark"]{
  --desk:#14303D; --desk2:#0F2530; --deskline:#1D4052; --paper:#F1E7C6; --paper2:#E6DAB2;
  --kraft:#C7A267; --kraft2:#A07A3E; --onDesk:#EDE2C6;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--desk); color:var(--ink); font-family:var(--font);
  background-image:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.025) 46px 48px);
  -webkit-tap-highlight-color:transparent; font-size:18px}
button{font-family:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hl); outline-offset:2px}
img,svg{max-width:100%}

/* top bar */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; display:flex; align-items:center; gap:8px;
  padding:8px 12px; background:var(--desk2); color:var(--onDesk); border-bottom:2px solid var(--deskline)}
.bar .home{border:0; background:none; font-size:26px; padding:4px 6px; color:var(--onDesk)}
.bar .name{flex:1; font-size:17px; opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.starpill{background:var(--paper); color:var(--ink); border-radius:999px; padding:4px 12px; font-weight:700; font-size:18px; box-shadow:var(--shadow)}
.seg{display:flex; background:rgba(0,0,0,.25); border-radius:12px; padding:3px}
.seg button{border:0; background:none; color:var(--onDesk); font-size:15px; padding:6px 9px; border-radius:9px; white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--paper); color:var(--ink); font-weight:700}
.gear{border:0; background:none; font-size:22px; padding:4px}

@media (max-width:440px){ .bar .name{visibility:hidden} }
main{max-width:760px; margin:0 auto; padding:14px 14px 40px}
.vnote{max-width:760px; margin:10px auto 0; padding:10px 14px; background:#FFE6DA; color:#6B2419; border-radius:10px; font-size:16px; line-height:1.5}
.vnote b{color:var(--stamp)}

/* zhuyin annotated text */
.ann{line-height:2.1}
.wd{display:inline-flex; flex-wrap:nowrap; border-radius:8px; transition:background .15s}
.wd.on{background:var(--hl)}
.u{display:inline-flex; align-items:center; margin:0 .02em; vertical-align:middle}
.hz{font-size:1em; line-height:1.15}
.zy{position:relative; display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:.42em; line-height:1; margin-left:.1em; padding-right:.62em; min-height:2.2em}
.zy b{display:block; font-weight:400; height:1.04em}
.zy .tn,.zy .tq{position:absolute; right:0; font-style:normal; top:calc(50% - .5em + (var(--n) - 1) * .42em)}
.zy .lt{position:absolute; top:-.2em; left:calc(50% - .31em - .25em); font-style:normal; transform:translateY(-.55em)}
.zy .tq{background:var(--stamp); color:#fff; border-radius:50%; width:1.3em; height:1.3em; right:-.35em; display:grid; place-items:center; font-size:1em; font-weight:700; top:calc(50% - .65em)}
.pn{display:inline-block; vertical-align:middle}
.ck{display:inline-flex; flex-wrap:nowrap; align-items:center; vertical-align:middle}
.u.tgt .zy{font-size:.55em}
.zyonly .ann:not(.keephz) .hz, .zyo .hz{display:none}
.grid:not(.zyo) .zy{font-size:.45em}
.zyonly .ann:not(.keephz) .zy, .zyo .zy{font-size:.7em; margin-left:.05em}
.zyonly .ann:not(.keephz) .u, .zyo .u{margin:0 .12em}
.zyo.big .zy{font-size:1em}
.zyo.big .u{margin:0 .25em}
.big{font-size:clamp(34px,10vw,54px)}
.huge{font-size:clamp(46px,15vw,78px)}

/* 作業簿 grid */
.grid .u, .grid .pn{border:1.5px solid var(--grid); margin:0 -1.5px -1.5px 0; background:var(--paper); padding:.06em .02em .06em .1em; min-height:1.62em}
.grid .zy{border-left:1px dashed var(--grid); padding-left:.18em}
.grid .pn{width:1.1em; display:inline-flex; align-items:center; justify-content:center}
.grid .wd.on .u{background:var(--hl)}
.grid.ann{line-height:1; display:flex; flex-wrap:wrap; row-gap:.35em}
.grid .ck{align-items:stretch}

.paper{background:var(--paper); border-radius:6px; box-shadow:0 2px 0 var(--paper2),0 6px 14px rgba(0,0,0,.2); padding:14px 16px}
.say{border:0; background:var(--amber); color:var(--ink); border-radius:12px; font-size:20px; padding:8px 12px; box-shadow:0 3px 0 var(--amber2); vertical-align:middle}
.say.alt{background:var(--gridsoft); box-shadow:0 3px 0 var(--grid)}
.say:active,.btn:active{transform:translateY(2px); box-shadow:none}
.btn{border:0; border-radius:14px; background:var(--amber); color:var(--ink); font-size:21px; font-weight:700; padding:12px 20px; box-shadow:0 4px 0 var(--amber2); display:inline-flex; align-items:center; gap:8px; justify-content:center}
.btn.ghost{background:var(--paper); box-shadow:0 4px 0 var(--kraft2)}
.btn.big{font-size:26px; padding:16px 30px}
.btn.wide{width:100%}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.center{text-align:center}
.lbl{color:var(--onDesk); font-size:17px; margin:18px 2px 8px}

/* home */
.hero{text-align:center; color:var(--onDesk); padding-top:6px}
.mascot{width:min(340px,86vw); margin:0 auto; display:block}
.mascot svg{display:block; width:100%; height:auto}
.title{margin:4px 0 10px; font-weight:700; color:var(--onDesk)}
.title .t1{font-size:clamp(38px,10.5vw,66px)}
.title .t2{font-size:clamp(26px,7vw,38px); color:var(--kraft)}
.title .zy{color:var(--kraft)}
.bubble{color:var(--ink); text-align:left; font-size:26px; margin:10px auto 18px; position:relative; max-width:560px}
.bubble::before{content:""; position:absolute; top:-12px; left:50%; border:12px solid transparent; border-top:0; border-bottom-color:var(--paper); transform:translateX(-50%)}
.pills{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:0 0 18px}
.pill{background:rgba(0,0,0,.25); color:var(--onDesk); border-radius:999px; padding:6px 14px; font-size:18px}

/* case folders */
.folders{display:grid; gap:26px; margin-top:26px}
.folder{position:relative; text-align:left; border:0; background:var(--kraft); border-radius:4px 16px 16px 16px; padding:18px 18px 16px; box-shadow:0 5px 0 var(--kraft2); font-size:30px}
.folder::before{content:attr(data-tab); position:absolute; top:-24px; left:0; background:var(--kraft); padding:3px 16px 2px; border-radius:10px 10px 0 0; font-size:17px; color:var(--ink2)}
.folder .fplace{display:block; font-size:20px; color:var(--ink2); margin-top:4px}
.folder .fmeta{display:flex; gap:10px; align-items:center; margin-top:8px; font-size:18px}
.folder.locked{filter:grayscale(.7) brightness(.85); cursor:not-allowed}
.folder .stamp{position:absolute; right:14px; top:14px; font-size:24px}
.stamp{display:inline-block; color:var(--stamp); border:4px double var(--stamp); border-radius:8px; padding:2px 10px; font-weight:700; transform:rotate(-12deg); letter-spacing:.1em; background:rgba(255,255,255,.15)}

/* progress */
.track{display:flex; gap:6px; align-items:center; justify-content:center; margin:2px 0 14px; color:var(--onDesk)}
.track i{font-style:normal; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:rgba(0,0,0,.25); font-size:17px; opacity:.55}
.track i.done{background:var(--good); opacity:1}
.track i.now{background:var(--paper); opacity:1; outline:3px solid var(--amber)}
.casehead{color:var(--onDesk); text-align:center; font-size:26px; margin:0 0 8px}

/* story */
.lines{display:flex; flex-direction:column; gap:12px; font-size:clamp(26px,7vw,38px)}
.line.past{opacity:.55; font-size:.72em}
.line.cur{outline:3px solid var(--amber)}
.controls{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px; padding:10px; background:rgba(0,0,0,.28); border-radius:18px; backdrop-filter:blur(4px)}

/* puzzles */
.prompt{font-size:clamp(24px,6.6vw,32px); display:flex; gap:10px; align-items:flex-start}
.prompt .ann{flex:1}
.note{position:relative; margin:22px auto; width:fit-content; max-width:100%; background:#FFFDF3; padding:22px 26px 18px; transform:rotate(-1.5deg); box-shadow:0 6px 16px rgba(0,0,0,.3); text-align:center}
.note::before{content:""; position:absolute; top:-12px; left:calc(50% - 40px); width:80px; height:24px; background:rgba(234,154,59,.55); transform:rotate(3deg)}
.note .say{margin-top:10px}
.opts{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.opt{border:0; background:var(--paper); border-radius:16px; padding:14px 4px 12px; box-shadow:0 5px 0 var(--kraft2); display:flex; flex-direction:column; align-items:center; gap:4px; font-size:clamp(20px,5.4vw,28px)}
.opt .em{font-size:clamp(44px,13vw,64px); line-height:1.1}
.opt.right{background:var(--goodbg); box-shadow:0 5px 0 var(--good); outline:4px solid var(--good)}
.opt.wrong{animation:shake .4s}
.opt.hint{animation:pulse 1s infinite}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pulse{50%{transform:scale(1.05); box-shadow:0 5px 0 var(--amber2),0 0 0 6px var(--hl)}}
.stage{background:var(--paper); border-radius:16px; padding:18px 12px; margin:16px 0; text-align:center}
.slot{display:block; min-width:1.2em; border:2px dashed var(--stamp); border-radius:4px; color:var(--stamp); margin:.08em 0; height:auto!important; padding:.04em .08em}
.slot.fill{border-style:solid; border-color:var(--good); color:var(--good); animation:popin .35s}
.tslot{position:absolute; right:-.9em; top:calc(50% - .7em); width:1.2em; height:1.4em; border:2px dashed var(--stamp); border-radius:4px; color:var(--stamp); display:grid; place-items:center}
.tslot.fill{border-style:solid; border-color:var(--good); color:var(--good)}
/* Reserve the tone box inside a fill-in character so the next character cannot cover it. */
.u.has-slots{margin-inline:.14em}
.u.has-slots .zy{padding-right:1.65em}
.u.has-slots .tslot{right:.15em}
@keyframes popin{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.steps{display:flex; justify-content:center; gap:8px; margin:6px 0 10px; font-size:18px}
.steps > span{padding:4px 12px; border-radius:999px; background:rgba(255,255,255,.12); color:var(--onDesk)}
.steps > span.now{background:var(--amber); color:var(--ink); font-weight:700}
.steps > span.ok{background:var(--goodbg); color:var(--good)}
.steps .ann{line-height:1.4}
.chips{display:flex; flex-wrap:wrap; gap:12px; justify-content:center}
.chip{border:0; min-width:74px; height:84px; padding:0 12px; border-radius:16px; background:#fff; font-size:40px; box-shadow:0 5px 0 var(--kraft2); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1}
.chip small{font-size:15px; color:var(--ink2); margin-top:4px}
.chip.v{font-size:32px; gap:0}
.chip.v span{display:block; line-height:1.02}
.chip.wrong{animation:shake .4s}
.chip.hint{animation:pulse 1s infinite}
.tones{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
.tones .chip{min-width:0; padding:0 4px; font-size:56px; height:104px}
.refrow{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:10px 0}
.refrow button{border:0; background:var(--gridsoft); border-radius:12px; padding:4px 10px; font-size:30px}

.witness{display:flex; gap:12px; align-items:flex-start}
.witness .who{flex:none; text-align:center; font-size:22px; color:var(--onDesk)}
.witness .who .em{font-size:60px; display:block; line-height:1}
.witness .paper{flex:1; font-size:clamp(28px,8vw,40px)}

.notebook{background:var(--paper); border-radius:6px; padding:8px 12px 8px 34px; position:relative}
.cl + .cl{border-top:1px dashed var(--grid)}
.notebook::before{content:""; position:absolute; left:18px; top:0; bottom:0; width:2px; background:#E9A3A3}
.cl{display:flex; gap:8px; align-items:center; font-size:22px; padding:4px 0}
.cl .em{font-size:30px}
.cl .ann{flex:1}
.suspects{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.sus{background:var(--paper); border-radius:16px; padding:14px; text-align:center; position:relative; box-shadow:0 5px 0 var(--kraft2)}
.sus .em{font-size:64px; line-height:1.1}
.sus .nm{font-size:30px; font-weight:700}
.sus .tr{font-size:21px; text-align:left; margin:6px 0 10px}
.sus.wrong{animation:shake .4s}
.sus.right{outline:4px solid var(--good)}
.sus .stamp{position:absolute; top:34px; left:50%; font-size:40px; transform:translateX(-50%) rotate(-14deg); animation:slam .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{transform:translateX(-50%) rotate(-14deg) scale(3); opacity:0}100%{transform:translateX(-50%) rotate(-14deg) scale(1); opacity:1}}

/* little stage */
.stagebox{position:relative; height:176px; margin:0 0 12px; border-radius:14px; overflow:hidden; cursor:pointer;
  display:flex; align-items:flex-end; justify-content:center; gap:22px; padding-bottom:10px;
  background:linear-gradient(#D7EEF6 0 74%, #BFDDB0 74% 100%)}
.stagebox.night{background:linear-gradient(#34507A 0 74%, #4E6B4A 74% 100%)}
.stagebox.fest{background:repeating-linear-gradient(45deg,#fff 0 10px,#8CC4EA 10px 20px) top/100% 16px no-repeat, linear-gradient(#DCEFFA 0 74%, #C9DDA8 74% 100%)}
.stagebox.sky{background:radial-gradient(circle at 20% 35%,#fff 0 16px,transparent 17px), radial-gradient(circle at 78% 25%,#fff 0 12px,transparent 13px), linear-gradient(#9FD3F2,#E3F4FC)}
.stagebox.home{background:linear-gradient(#FCE3CF 0 74%, #D8A874 74% 100%)}
.stagebox.magic{background:radial-gradient(circle at 18% 20%,#FFF5B8 0 3px,transparent 4px),radial-gradient(circle at 78% 28%,#FFF5B8 0 3px,transparent 4px),linear-gradient(#30345E 0 74%,#6B4B75 74% 100%)}
.stagebox.night::before{content:"✦ · ✧ · ✦"; position:absolute; top:10px; left:0; right:0; text-align:center; color:#FFE9A8; letter-spacing:34px; font-size:12px; opacity:.8}
.actor{position:relative; display:flex; align-items:flex-end; justify-content:center}
.actor .ac{display:block; font-size:74px; line-height:1; transform-origin:50% 92%; animation:idle 2.6s ease-in-out infinite}
.actor.person .ac svg{display:block; height:150px; width:auto; max-width:none}
.sus .actor .ac{font-size:64px}
.sus .actor.person .ac svg{height:120px}
.sus{position:relative}
.who{position:relative}
.who .actor .ac{font-size:60px}
.who .actor.person .ac svg{height:96px}
.actor{cursor:pointer}
.actor svg ellipse[fill="#2A1B12"]{transform-box:fill-box; transform-origin:center; animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bub{position:absolute; z-index:3; transform:translate(-50%,-100%); background:#fff; color:var(--ink); border:3px solid var(--ink); border-radius:16px; padding:2px 10px; font-size:18px; font-weight:700; white-space:nowrap; animation:bubPop 1.9s ease forwards; pointer-events:none}
.bub::after{content:""; position:absolute; left:50%; bottom:-10px; border:7px solid transparent; border-top-color:var(--ink); transform:translateX(-50%)}
@keyframes bubPop{0%{opacity:0; transform:translate(-50%,-80%) scale(.3)}12%{opacity:1; transform:translate(-50%,-100%) scale(1.15)}20%{transform:translate(-50%,-100%) scale(1)}85%{opacity:1}100%{opacity:0; transform:translate(-50%,-115%)}}
.actor.hid .ac{opacity:0; animation:none}
.card .actor .ac{font-size:84px}
@keyframes idle{50%{transform:translateY(-3px) scale(1.02)}}
.a-jump .ac,.a-cheer .ac{animation:aJump 1s ease both}
.a-cheer .ac{animation-iteration-count:2}
.a-wave .ac,.a-dance .ac,.a-wiggle .ac{animation:aWave 1.1s ease-in-out both}
.a-shake .ac{animation:aShake .7s ease both}
.a-shiver .ac{animation:aShiver 1s linear both}
.a-cry .ac{animation:aCry 1.5s ease-in-out both}
.a-sad .ac{animation:aSad 1s ease forwards}
.a-spin .ac{animation:aSpin .9s ease both}
.a-gone .ac{animation:aGone 1s ease-in forwards}
.a-appear .ac{animation:aAppear .7s cubic-bezier(.2,1.6,.4,1) both}
.a-glow .ac{animation:aGlow 1.6s ease-in-out both}
.a-wow .ac{animation:aWow .7s ease both}
.a-think .ac{animation:aThink 1.4s ease both}
.a-proud .ac{animation:aProud 1.3s ease both}
.a-laugh .ac{animation:aLaugh 1.2s ease both}
.a-eat .ac{animation:aEat 1.1s ease both}
.a-nod .ac,.a-pat .ac{animation:aNod 1s ease both}
.a-love .ac{animation:aLove 1.2s ease both}
.a-search .ac{animation:aSearch 1.8s ease-in-out both}
.a-sparkle .ac{animation:aWow .9s ease both}
.a-boing .ac{animation:aBoing .9s ease both}
.a-run .ac{animation:aRun .8s cubic-bezier(.2,.9,.3,1.2) both}
.a-fly .ac{animation:aFly 1.8s ease-in-out both}
.a-drive .ac{animation:aDrive 1.8s ease-in both}
.a-float .ac{animation:aFloat 2s ease-in-out both}
.a-sleep .ac{animation:aSleep 2s ease both}
.a-scratch .ac{animation:aScratch 1.2s ease both}
.a-shock .ac{animation:aShock 1s ease both}
.a-hug .ac{animation:aHug 1.3s ease both}
.a-wink .ac,.a-yum .ac{animation:aLove 1.2s ease both}
.a-yum .ac{animation:aEat 1.1s ease both}
.a-brake .ac{animation:aBrake 1s ease both}
@keyframes aBoing{15%{transform:scale(1.25,.72)}35%{transform:translateY(-26px) scale(.82,1.22)}55%{transform:translateY(0) scale(1.14,.86)}72%{transform:scale(.94,1.06)}86%{transform:scale(1.03,.97)}}
@keyframes aRun{0%{transform:translateX(calc(var(--dir) * 170px)) rotate(calc(var(--dir) * -10deg))}70%{transform:translateX(calc(var(--dir) * -10px)) rotate(calc(var(--dir) * 6deg))}}
@keyframes aFly{0%{transform:translate(-190px,50px) rotate(-12deg)}55%{transform:translate(190px,-40px) rotate(-12deg); opacity:1}56%{opacity:0}60%{transform:translate(0,-20px) scale(.3); opacity:0}100%{transform:none; opacity:1}}
@keyframes aDrive{0%{transform:none}10%{transform:translateX(-14px)}55%{transform:translateX(240px); opacity:1}56%{opacity:0; transform:translateX(-240px)}100%{transform:none; opacity:1}}
@keyframes aFloat{25%{transform:translate(-18px,-6px)}75%{transform:translate(18px,4px)}}
@keyframes aSleep{25%,85%{transform:rotate(-14deg) translateY(4px)}50%{transform:rotate(-14deg) translateY(4px) scale(1.04)}}
@keyframes aScratch{20%,60%{transform:rotate(-8deg) translateY(2px)}40%,80%{transform:rotate(4deg)}}
@keyframes aShock{15%{transform:translateY(-34px) scale(.9,1.2)}30%{transform:translateY(0) scale(1.1,.9)}45%,75%{transform:translateX(-7px)}60%,90%{transform:translateX(7px)}}
@keyframes aHug{35%,70%{transform:translateX(calc(var(--dir) * -22px)) rotate(calc(var(--dir) * -10deg)) scale(1.05)}}
@keyframes aBrake{0%{transform:translateX(-120px)}55%{transform:translateX(14px) rotate(-6deg)}75%{transform:translateX(-4px) rotate(2deg)}100%{transform:none}}
@keyframes aJump{25%{transform:translateY(-46px) scaleY(1.05)}45%{transform:translateY(0) scaleY(.88)}65%{transform:translateY(-20px)}85%{transform:translateY(0) scaleY(.95)}}
@keyframes aWave{20%{transform:rotate(-14deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-12deg)}80%{transform:rotate(10deg)}}
@keyframes aShake{15%,55%{transform:translateX(-12px)}35%,75%{transform:translateX(12px)}}
@keyframes aShiver{10%,30%,50%,70%,90%{transform:translateX(-4px)}20%,40%,60%,80%{transform:translateX(4px)}}
@keyframes aCry{20%,60%{transform:translateY(4px) rotate(-5deg)}40%,80%{transform:translateY(4px) rotate(5deg)}}
@keyframes aSad{to{transform:translateY(10px) rotate(-10deg) scale(.94)}}
@keyframes aSpin{to{transform:rotate(360deg)}}
@keyframes aGone{30%{transform:scale(1.2)}100%{transform:scale(0) rotate(200deg); opacity:0}}
@keyframes aAppear{0%{transform:scale(0); opacity:0}100%{transform:scale(1); opacity:1}}
@keyframes aGlow{30%,70%{transform:scale(1.1); filter:drop-shadow(0 0 16px #FFD54A)}}
@keyframes aWow{40%{transform:scale(1.35)}}
@keyframes aThink{30%,80%{transform:rotate(-12deg)}}
@keyframes aProud{30%,75%{transform:translateY(-8px) scale(1.18)}}
@keyframes aLaugh{15%,45%,75%{transform:translateY(-10px) rotate(-4deg)}30%,60%,90%{transform:translateY(0) rotate(4deg)}}
@keyframes aEat{20%,60%{transform:scale(1.08,.86)}40%,80%{transform:scale(.95,1.06)}}
@keyframes aNod{25%,75%{transform:rotate(10deg) translateY(3px)}50%{transform:rotate(0)}}
@keyframes aLove{30%,70%{transform:scale(1.12)}50%{transform:scale(1.02)}}
@keyframes aSearch{20%{transform:rotate(-8deg) translateX(-8px)}50%{transform:rotate(8deg) translateX(8px)}80%{transform:rotate(-5deg)}}
.pt{position:absolute; pointer-events:none; font-size:24px; line-height:1; margin:-12px 0 0 -12px; opacity:0; animation:ptRise 1.5s ease-out forwards; z-index:2}
.pt.fall{animation-name:ptFall; font-size:18px}
.pt.pop{animation-name:ptPop}
.pt.one{animation-name:ptOne; font-size:30px}
.pt.orbit{animation-name:ptOrbit; animation-duration:1.8s; font-size:30px}
.pt.rise{color:var(--stamp); font-weight:700}
@keyframes ptRise{0%{opacity:0; transform:scale(.5)}20%{opacity:1}100%{opacity:0; transform:translate(var(--dx),-72px) scale(1.1)}}
@keyframes ptFall{0%{opacity:0}20%{opacity:1}100%{opacity:0; transform:translate(var(--dx),64px)}}
@keyframes ptPop{0%{opacity:0; transform:scale(.2)}40%{opacity:1; transform:translate(var(--dx),var(--dy)) scale(1.2)}100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.9)}}
@keyframes ptOne{0%{opacity:0; transform:scale(.2)}30%{opacity:1; transform:translate(var(--dx),var(--dy)) scale(1.3)}80%{opacity:1; transform:translate(var(--dx),var(--dy)) scale(1)}100%{opacity:0; transform:translate(var(--dx),var(--dy))}}
@keyframes ptOrbit{0%{opacity:0; transform:translate(-44px,0)}15%{opacity:1}50%{transform:translate(40px,-40px) rotate(20deg)}85%{opacity:1; transform:translate(-26px,-26px) rotate(-10deg)}100%{opacity:0}}
.mascot.party svg{animation:aJump 1s ease 3; transform-origin:50% 95%}

.qbox{background:var(--paper); border-radius:16px; padding:12px 14px; margin:12px 0; border:4px solid var(--amber)}
.qbox.pickbox{border-color:var(--grid); border-style:dashed}
.qhead{font-size:19px; font-weight:700; color:var(--ink2)}
.qask{font-size:clamp(24px,6.4vw,30px); margin:4px 0 10px}
.qopts{display:grid; gap:10px}
.qopt{border:0; background:#FFF7E0; border-radius:14px; padding:10px 12px; box-shadow:0 4px 0 var(--kraft2); display:flex; align-items:center; gap:12px; text-align:left; font-size:clamp(22px,5.8vw,28px); width:100%}
.qopt .em{font-size:40px; flex:none}
.qopt.right{background:var(--goodbg); box-shadow:0 4px 0 var(--good); outline:3px solid var(--good)}
.qopt.wrong{animation:shake .4s}
.qopt.hint{animation:pulse 1s infinite}
.qopt:disabled{opacity:.55}
.qfb{font-size:clamp(20px,5.4vw,26px); margin-top:8px; min-height:1.2em}
.btn.dim{opacity:.5}
.hunt{display:flex; flex-wrap:wrap; align-items:center; gap:8px; background:var(--paper); border-radius:14px; padding:8px 14px; margin:0 0 10px; border:3px dashed var(--amber); font-size:clamp(26px,7vw,34px)}
.hunt .hq{font-size:18px; font-weight:700; color:var(--ink2)}
.hunt .htarget{background:#FFF1C9; border-radius:10px; padding:0 8px}
.hunt.done{border-style:solid; border-color:var(--good); background:var(--goodbg)}
.hunt .got{margin-left:auto; font-size:24px}
.symbtn{border:0; background:#FFF1C9; border-radius:12px; font-size:40px; padding:2px 16px; box-shadow:0 3px 0 var(--kraft2)}
.tip{color:var(--onDesk); text-align:center; font-size:16px; margin:8px 0 0; opacity:.85}
.wd.hit{background:#BDE8C9!important}
.grid .wd.hit .u{background:#BDE8C9}
.wd.miss{animation:shake .4s}
.wd.hint{animation:pulse 1s infinite}
.grid .wd.hint .u{background:var(--hl)}
.line{cursor:pointer}
.plus{position:fixed; z-index:80; transform:translate(-50%,-50%); font-size:28px; font-weight:700; color:var(--amber2); text-shadow:0 2px 0 #fff,0 0 8px #fff; pointer-events:none; animation:plusUp 1.3s ease-out forwards}
@keyframes plusUp{0%{opacity:0; transform:translate(-50%,-30%) scale(.5)}20%{opacity:1; transform:translate(-50%,-80%) scale(1.3)}100%{opacity:0; transform:translate(-50%,-260%) scale(1)}}
.starpill.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.35)}}
.ahud{display:flex; justify-content:space-around; color:var(--onDesk); font-size:26px; margin:4px 0 10px}
.ahud b{font-size:32px}
.atarget{display:flex; align-items:center; justify-content:center; gap:14px; background:var(--paper); border-radius:18px; padding:8px; margin-bottom:14px}
.atarget .em{font-size:60px; line-height:1.1}
.holes{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.hole{position:relative; height:clamp(112px,28vw,150px); overflow:hidden; border-radius:14px;
  background:radial-gradient(ellipse 46% 16% at 50% 88%, #3B2A1C 0 98%, transparent 100%), linear-gradient(#8CC46A,#6EA84E)}
.mole{position:absolute; left:4%; right:4%; bottom:6px; border:0; background:none; display:flex; flex-direction:column; align-items:center; transform:translateY(105%); transition:transform .22s cubic-bezier(.3,1.5,.5,1); padding:0}
.mole.up{transform:translateY(0)}
.mole .sign{background:#FFFDF3; border:3px solid #8A5A2B; border-radius:10px; padding:2px 6px; font-size:clamp(22px,6.2vw,30px); min-height:1.2em; max-width:100%}
.mole .sign .ann{line-height:1.3}
.mole .critter{font-size:clamp(40px,11vw,56px); line-height:1}
.mole.hitme .critter{animation:aBoing .5s}
.mole.hitme .sign{background:var(--goodbg); border-color:var(--good)}
.mole.no{animation:shake .4s}
.mole.showme .sign{background:var(--hl); border-color:var(--amber2); animation:pulse 1s infinite}
.aword{font-size:40px; font-weight:700}
.magic-score{display:flex;justify-content:space-between;align-items:center;background:#302B55;color:#fff;border-radius:18px;padding:10px 16px;margin:0 0 14px;font-size:20px}
.magic-score b{color:#FFE58A;font-size:27px}.gift-shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin:18px 0}
.gift{background:#FFF7D8;border:2px solid #E4C96B;border-radius:18px;padding:13px 8px;text-align:center;font-size:16px}.gift .em{display:block;font-size:42px}.gift.lock{filter:grayscale(1);opacity:.38}
.birthday-wish{background:#F5F0FF;border:2px dashed #8E72B5;border-radius:20px;padding:16px;margin:16px 0;font-size:21px;line-height:1.7}

button .ann,.lbl .ann,.hq .ann,.tip .ann,.pill .ann,.fmeta .ann,.stamp .ann,.rankup .ann,.toast .ann,.bub .ann,.name .ann,.steps .ann,.chip small .ann,.ftab .ann{line-height:1.45}
.folder .ftab{position:absolute; top:-30px; left:0; background:var(--kraft); padding:2px 14px 0; border-radius:10px 10px 0 0; font-size:17px; color:var(--ink2)}
.folder::before{display:none}
.folders{gap:40px}
.bub .zy{font-size:.45em}
.chip small{font-size:15px}
#modeZi{display:inline-block}

.mic{border:0; background:#E4574B; color:#fff; border-radius:999px; font-size:20px; font-weight:700; padding:8px 18px; box-shadow:0 4px 0 #A83A30}
.mic.big{font-size:28px; padding:12px 34px}
.mic.on{background:var(--good); box-shadow:0 4px 0 #1E6B3E; animation:pulse 1s infinite}
.mic:disabled{opacity:.4}
.mic .ann .zy{color:#fff}
.hmic{flex-basis:100%; display:flex; flex-direction:column; align-items:flex-start; gap:6px; margin-top:4px}
.hfb{font-size:22px}
.vcard{display:flex; align-items:center; justify-content:center; gap:14px; margin:12px 0}
.vcard .em{font-size:72px}
.vhow{color:var(--onDesk); font-size:22px; margin:8px 0 12px}
.vfb{min-height:2em; text-align:center; font-size:24px; color:var(--onDesk); margin:12px 0}
.vfb b{background:var(--paper); color:var(--ink); border-radius:8px; padding:0 6px}

.booth{position:relative; border-radius:16px; overflow:hidden; padding:10px;
  background:repeating-linear-gradient(45deg,#fff 0 12px,#E0544B 12px 24px) top/100% 18px no-repeat, linear-gradient(#FFE6B8,#F3C98B)}
.bq{display:flex; align-items:center; justify-content:center; gap:12px; background:var(--paper); border-radius:14px; margin:14px 0 10px; padding:6px}
.bqz{font-size:clamp(34px,9vw,46px)}
.lane{position:relative; height:clamp(300px,74vw,380px); border-radius:12px; overflow:hidden;
  background:repeating-linear-gradient(#CDE9F5 0 24%, #B7DCEE 24% 25%)}
.duck{position:absolute; border:0; background:none; font-size:clamp(46px,13vw,64px); line-height:1; padding:0; left:-22%;
  animation:swim linear infinite; cursor:crosshair; filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.duck.rev{animation-name:swimR}
.duck.hit{animation:none!important; transform:scale(1.5) rotate(20deg); opacity:.2; transition:.4s}
.duck.miss{animation-play-state:paused; filter:grayscale(1)}
@keyframes swim{from{left:-22%}to{left:105%}}
@keyframes swimR{from{left:105%}to{left:-22%}}
.bang{position:fixed; z-index:80; transform:translate(-50%,-50%); font-size:52px; pointer-events:none; animation:popin .3s, plusUp .7s ease-out forwards}
.wheelbox{position:relative; height:180px; display:grid; place-items:center}
.wheel{font-size:150px; animation:aSpin 6s linear infinite; display:block}
.cab{position:absolute; bottom:6px}
.cab .actor .ac svg{height:70px}
.lane .duck{touch-action:manipulation}

/* overlays */
.overlay{position:fixed; inset:0; z-index:50; background:rgba(15,34,44,.82); display:flex; align-items:center; justify-content:center; padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px); overflow:auto}
.card{background:var(--paper); border-radius:18px; padding:20px; max-width:520px; width:100%; text-align:center; animation:popin .4s}
.card .em{font-size:84px; line-height:1.1}
.card .txt{font-size:clamp(24px,6.5vw,32px); margin:8px 0 12px}
.card .hdr{font-size:28px; color:var(--good); font-weight:700}
.starsrow{font-size:38px; letter-spacing:4px; margin:4px 0 12px}
.starsrow .bonus{font-size:18px; display:block; letter-spacing:0; color:var(--amber2)}
.celebrate .stamp{font-size:40px; white-space:nowrap; margin:14px 0 6px; animation:slam2 .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam2{0%{transform:rotate(-12deg) scale(3); opacity:0}100%{transform:rotate(-12deg) scale(1); opacity:1}}
.badge{font-size:96px; line-height:1}
.rankup{background:var(--hl); border-radius:12px; padding:8px; font-size:22px; margin:10px 0}

/* guide */
.symgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(98px,1fr)); gap:10px}
.sym{border:0; background:var(--paper); border-radius:14px; padding:8px 4px; box-shadow:0 4px 0 var(--kraft2); display:flex; flex-direction:column; align-items:center; gap:2px}
.sym .s{font-size:46px; line-height:1.1}
.sym .ex{font-size:20px}
.sym .ex .ann{line-height:1.5}
.sym.on{outline:4px solid var(--amber)}
.tonegrid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
.tonegrid .sym .s{font-size:36px}

/* badges */
.badges{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.sect{margin:8px 2px 2px; font-size:20px; font-weight:700}
.bslot{background:var(--paper); border-radius:16px; padding:14px 6px; text-align:center; font-size:20px}
.bslot .badge{font-size:64px}
@media (max-width:440px){ .bslot .badge{font-size:48px} .bslot{font-size:17px} }
.bslot.off .badge{filter:grayscale(1) brightness(.4); opacity:.35}
.cert{margin-top:22px; background:var(--paper); border:8px double var(--amber2); border-radius:10px; padding:22px; text-align:center}
.cert h2{margin:0; font-size:34px}
.cert .who{font-size:40px; font-weight:700; margin:10px 0; color:var(--stamp)}

/* settings */
.form{display:grid; gap:16px}
.form label{display:grid; gap:6px; font-size:19px}
.form input[type=text],.form select{font:inherit; font-size:20px; padding:10px; border-radius:10px; border:2px solid var(--kraft2); background:#fff; color:var(--ink)}
.form input[type=range]{width:100%}
.check{display:flex!important; grid-template-columns:none; align-items:center; gap:10px}
.check input{width:26px; height:26px}
.muted{color:var(--ink2); font-size:16px; line-height:1.5}

.toast{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 70px); transform:translateX(-50%); z-index:60; background:var(--paper); border-radius:999px; padding:8px 20px; font-size:24px; font-weight:700; box-shadow:0 6px 20px rgba(0,0,0,.35); animation:popin .35s}
canvas#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:70}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important; transition:none!important}
}

/* Bright field-journal theme. Annotation geometry intentionally stays unchanged. */
:root, :root[data-theme="dark"], :root:not([data-theme="light"]){
 --desk:#F7F8F2;--desk2:#FFFFFF;--deskline:#E2E8DC;--paper:#FFFFFF;--paper2:#EDF1E8;
 --kraft:#E6F0DD;--kraft2:#B7CDA5;--grid:#A4C6B6;--gridsoft:#E8F4EE;
 --ink:#263D35;--ink2:#63756B;--onDesk:#263D35;--stamp:#C65743;
 --amber:#F5C65B;--amber2:#C89831;--hl:#FFF0BA;--shadow:0 3px 0 #DFE5D9;
}
body{background-image:radial-gradient(#DCE6D7 1px,transparent 1px);background-size:24px 24px}
.bar{padding:12px max(14px,calc((100vw - 1040px)/2));border-bottom:1px solid var(--deskline);box-shadow:0 4px 20px #314A3610;gap:12px}
.bar .name{font-size:19px}.seg{background:#EEF2E9}.seg button{min-height:42px}.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 2px 6px #263D3514}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #287D69;outline-offset:4px}
main{max-width:1040px;padding:28px 24px 56px}
.paper,.stage,.card,.notebook,.sus{border:1px solid #DFE8D9;border-radius:24px;box-shadow:0 6px 22px #30463509}
.btn,.say,.chip,.opt{transition:transform .18s,box-shadow .18s;min-height:48px}
@media(hover:hover){.btn:hover,.activity:hover,.folder:not(.locked):hover{transform:translateY(-3px);box-shadow:0 8px 0 #B7CDA5}}
.hero{text-align:left;padding:0}.hero-panel{display:grid;grid-template-columns:1.12fr 1fr;align-items:center;background:#E9F1DF;border:1px solid #D8E5CB;border-radius:32px;overflow:hidden;padding:32px;gap:20px;position:relative}
.hero-copy{position:relative;z-index:1}.eyebrow{font-size:15px;letter-spacing:.12em;color:#25272D;margin:0 0 16px;font-weight:700}.title{margin:0 0 20px;color:var(--ink)}.title .t1{font-size:clamp(34px,4.3vw,50px)}.title .t2{font-size:clamp(23px,2.9vw,32px);color:#25272D}.title .zy{color:#25272D}
.hero .bubble{font-size:21px;line-height:1.8;margin:0 0 22px;padding:0;max-width:none;background:none;border:0;box-shadow:none}.bubble::before{display:none}
.hero .pills{justify-content:flex-start;margin:18px 0 0}.pill{background:#FFFFFFAA;border:1px solid #D9E4CE;font-size:16px;padding:7px 12px}
.hero-art{position:relative;min-height:340px;display:grid;place-items:center;border-radius:50% 50% 24px 24px;background:linear-gradient(#D4E9E3 0 75%,#B8D19A 75%);border:8px solid #FFFFFF80}
.hero-art::before{content:"";position:absolute;width:82px;height:82px;border-radius:50%;background:#FFE89A;right:26px;top:30px;box-shadow:-105px 30px 0 -28px #FFFFFFAA}
.hero-art::after{content:"";position:absolute;bottom:24px;width:80%;height:22px;border-radius:50%;background:#69865325}.hero-art .mascot{position:relative;z-index:1;width:100%;max-width:360px;margin-top:35px;filter:drop-shadow(0 8px 4px #43633B20)}
.art-token{position:absolute;z-index:2;background:white;border:2px solid #D7E5CA;border-radius:18px;padding:10px 16px;font-size:24px;box-shadow:0 5px 0 #A9C699;transform:rotate(-10deg);top:25px;left:18px}.art-token.second{top:auto;bottom:35px;left:auto;right:10px;transform:rotate(10deg);background:#FFF2C8}
.section-label{display:flex;align-items:center;justify-content:space-between;margin:30px 2px 16px}.section-label h2{font-size:25px;margin:0}.section-label span{font-size:16px;color:var(--ink2)}
.activities{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.activity{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:12px;border:1px solid #DEE5D7;background:#fff;border-radius:24px;padding:22px;color:var(--ink);box-shadow:0 4px 0 #E2E7DC;transition:transform .18s,box-shadow .18s;cursor:pointer;font-size:22px}
.activity-icon{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--tile,#EFF3E7);font-size:35px}.activity-title{font-weight:700}.activity-foot{display:flex;width:100%;justify-content:space-between;align-items:center;color:var(--ink2);font-size:16px;margin-top:auto}.activity-arrow{font-size:24px;color:#25272D}.activity .ann{line-height:1.65}
.folders{grid-template-columns:repeat(2,minmax(0,1fr));gap:44px 22px;margin-top:36px}.folders .sect{grid-column:1/-1;margin:0}.folder{border:1px solid #D3E1C7;border-radius:0 24px 24px 24px;padding:24px;font-size:27px;transition:transform .18s,box-shadow .18s}.folder.locked{filter:none;background:#ECEFE8;color:#25272D;box-shadow:0 4px 0 #D7DED2}.folder .ftab{border:1px solid #D3E1C7;border-bottom:0}.fplace{line-height:1.8}
.controls{background:#E7EDE0;border:1px solid #D7E2CC;border-radius:22px;padding:14px}.track{flex-wrap:wrap;gap:9px;margin:8px 0 22px}.track i{background:#E5EBDD;opacity:1}.track i.now{outline:3px solid #EDBF55}.casehead{margin:6px 0 24px}.note{border-radius:20px;box-shadow:0 8px 24px #334A3415;border:1px solid #E8E5D4}.stagebox{border:1px solid #D9E5D1;border-radius:24px;height:220px}.opt{border:1px solid #DDE6D6}.lbl{font-weight:700}.sym{border:1px solid #DDE6D6;border-radius:20px}.steps>span{background:#E4EBDB}.ahud{background:#fff;border:1px solid #DEE7D6;border-radius:20px;padding:12px}.form input,.form select{max-width:100%}
@media(min-width:800px){main:has(.hero){padding-top:32px}main:not(:has(.hero)):not(:has(.folders)){max-width:820px}}
@media(max-width:700px){main{padding:18px 14px 40px}.hero-panel{grid-template-columns:1fr;padding:22px;gap:22px}.hero-art{grid-row:1;min-height:210px;max-width:360px;width:100%;justify-self:center}.hero-art .mascot{max-width:250px;margin-top:0}.hero-copy{text-align:center}.hero .pills{justify-content:center}.hero .bubble{text-align:left;font-size:20px}.title .t1{font-size:38px}.hero .btn.big{width:100%;font-size:24px}.activities{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.activity{padding:16px;font-size:20px;border-radius:20px}.activity-icon{width:54px;height:54px;font-size:30px}.activity-foot{font-size:14px}.section-label span{display:none}.folders{grid-template-columns:1fr}.bar{gap:6px;padding:8px}.bar .name{font-size:15px}.starpill{font-size:16px;padding:5px 8px}.seg button{padding:6px}.witness{gap:8px}.witness .who{font-size:18px}.suspects{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}

    let t='';

    else if (tn==='˙') t=`<i class="lt">˙</i>`;
    else if (tn) t=`<i class="tn" style="--n:${n}">${tn}</i>`;

// items: [{text, el?, rate?}]; done() runs once when the last item finishes (with a timer fallback)
function speakSeq(items, done){
  stopSpeak(); const id=++seqId; let fired=false, tm=null;
  const fire=()=>{ if(fired||id!==seqId) return; fired=true; clearTimeout(tm); if(done) done(); };
  if(done){ const duration=items.reduce((a,it)=>a+(it.symbol?1600:(it.text||'').length*330/S.rate),0); tm=setTimeout(fire,duration+(TTS?2600:700)); }
  const list=items.filter(it=>it.symbol||it.text);
  function next(k){
    if(id!==seqId)return;
    if(k===list.length){setTimeout(fire,150);return;}
    const it=list[k];
    const highlight=()=>{clearHl();if(it.el){(Array.isArray(it.el)?it.el:[it.el]).forEach(e=>{e.classList.add('on');hlEls.push(e);});}};
    let advanced=false;
    const advance=()=>{if(advanced||id!==seqId)return;advanced=true;clearHl();next(k+1);};
    if(it.symbol){
      highlight();
      window.zhuyinAudio.play(it.symbol).then(advance).catch(()=>{
        if(id!==seqId)return;
        clearHl();const note=$('#vnote');note.hidden=false;note.textContent='注音錄音尚未載入，請連上網路後再點一次。';fire();
      });
    }else if(TTS){
      if(TTS.paused)TTS.resume();
      const u=utter(it.text,it.rate,it.el);u.onstart=highlight;u.onend=advance;u.onerror=advance;TTS.speak(u);
    }else advance();
  }
  next(0);
}
const speak = (text, el, done) => speakSeq([{text, el}], done);
function speakWords(container, done){
  const ws=[...container.querySelectorAll('.wd')];
  speakSeq(ws.map(el=>({text:el.dataset.say, el, rate:Math.max(.6,S.rate-.1)})), done);
}
function playSym(z){
  const s = SYM.find(x=>x[0]===z);
  if (s) speakSeq([{symbol:z}]);
  else speak(REP[z]||z);
}

/* ---------- sound fx ---------- */
let AC=null;
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function beep(f, t0, dur, type='sine', vol=.14){
  const a=ac(); if(!a) return; const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=f; o.connect(g); g.connect(a.destination);
  const t=a.currentTime+t0; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.start(t); o.stop(t+dur+.05);
}
const fx = {
  ding(){ beep(880,0,.25); beep(1320,.1,.35); },
  wrong(){ beep(240,0,.18,'triangle',.12); beep(200,.12,.22,'triangle',.12); },
  pop(){ beep(700,0,.12,'sine',.1); },
  fanfare(){ [523,659,784,1047,784,1047].forEach((f,i)=>beep(f,i*.12,.3,'triangle',.12)); },
  stamp(){ beep(90,0,.25,'sine',.35); beep(140,0,.1,'square',.06); }
};

function sweep(f1,f2,dur,type='sine',vol=.12,t0=0){
  const a=ac(); if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.connect(g); g.connect(a.destination);
  const t=a.currentTime+t0; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.start(t); o.stop(t+dur+.05);
}
function noise(dur,f1,f2,vol=.12,t0=0){
  const a=ac(); if(!a) return; const n=a.createBufferSource(), buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; n.buffer=buf;
  const f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.2; const g=a.createGain(); n.connect(f); f.connect(g); g.connect(a.destination);
  const t=a.currentTime+t0; f.frequency.setValueAtTime(f1,t); f.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); n.start(t); n.stop(t+dur);
}
function sfx(k){
  switch(k){
    case 'hop': sweep(320,760,.16); break;
    case 'boing': sweep(160,560,.12,'sine',.16); sweep(560,240,.3,'sine',.12,.12); break;
    case 'whoosh': noise(.45,300,2400,.18); break;
    case 'poof': noise(.3,1800,300,.2); beep(900,.05,.08,'sine',.08); break;
    case 'honk': beep(415,0,.12,'square',.07); beep(415,.18,.14,'square',.07); break;
    case 'cry': sweep(700,380,.35,'triangle',.1); sweep(650,340,.4,'triangle',.1,.4); break;
    case 'laugh': [0,.1,.2,.3].forEach((t,i)=>beep(i%2?880:700,t,.08,'square',.05)); break;
    case 'twinkle': [1320,1760,2093].forEach((f,i)=>beep(f,i*.07,.18,'sine',.07)); break;
    case 'shock': sweep(300,1200,.18,'square',.05); beep(1568,.2,.25,'sine',.1); break;
    case 'snore': sweep(140,90,.7,'sawtooth',.03); break;
    case 'squeak': sweep(1100,1900,.12,'sine',.08); break;
    case 'wobble': [0,.08,.16,.24].forEach((t,i)=>beep(i%2?340:290,t,.08,'triangle',.08)); break;
    case 'hmm': beep(220,0,.14,'sine',.12); beep(262,.16,.18,'sine',.12); break;
    case 'chomp': [0,.14,.28].forEach(t=>noise(.06,900,500,.2,t)); break;
    case 'patter': for(let i=0;i<6;i++) beep(900+(i%2)*120,i*.06,.03,'triangle',.08); break;
    case 'skid': noise(.4,3000,1200,.12); break;
  }
}

function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#confetti'); c.hidden=false; const x=c.getContext('2d'); const W_=c.width=innerWidth, H=c.height=innerHeight;
  const cols=['#EA9A3B','#C8342B','#2F8F57','#FFE08A','#8FC4A5','#fff'];
  const ps=Array.from({length:140},()=>({x:Math.random()*W_, y:-20-Math.random()*H*.5, vx:(Math.random()-.5)*3, vy:2+Math.random()*4, r:Math.random()*6.28, s:6+Math.random()*8, c:cols[Math.random()*cols.length|0]}));
  let f=0; (function tick(){ x.clearRect(0,0,W_,H); ps.forEach(p=>{p.x+=p.vx; p.y+=p.vy; p.r+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore();}); if(++f<150) requestAnimationFrame(tick); else c.hidden=true; })();
}

let onListen=null;
document.addEventListener('click', e=>{
  ac();
  const go=e.target.closest('[data-go]'); if(go){ nav(go.dataset.go); return; }
  const sb=e.target.closest('.say[data-t]');
  if(sb){ if(sb.closest('.lis') && onListen) onListen(); speak(sb.dataset.t); return; }
  const wd=e.target.closest('.wd');
  if(wd && !wd.closest('.nospeak') && !wd.closest('button')){ if(wd.closest('.lis') && onListen) onListen(); const unit=e.target.closest('.u');speak(unit?.querySelector('.hz')?.textContent||wd.dataset.say, unit||wd); }
});

function chapterCards(){
  const colors=['forest','moon','market','festival','sky','home','magic'];
  return `<div class="island-map">${D.cases.map((c,i)=>{
    const firstJ=c.journey&&!D.cases[i-1].journey;
    const unlocked=i===0||c.special||firstJ||S.done[D.cases[i-1].id],done=S.done[c.id];
    return `<button class="island-card ${colors[i]} ${unlocked?'':'locked'} ${c.special?'featured-island':''}" data-case="${i}" ${c.special==='birthday'?'id="birthdayJump"':''} ${unlocked?'':'aria-disabled="true"'} aria-label="${esc(c.title.t)}">
      <div class="island-scene"><span class="island-number">${c.special?COVER.birthday():COVER.path()+' '+String(i+1).padStart(2,'0')}</span><span class="island-object" aria-hidden="true">${c.place}</span>${!unlocked?'<span class="island-lock">🔒</span>':''}</div>
      <div class="island-info"><strong>${A(c.title,{cls:'keephz nospeak'})}</strong><small>${A(c.placeName,{cls:'keephz nospeak'})}</small><div class="island-status">${done?'⭐ '+caseStars(c)+' '+COVER.done():unlocked?COVER.start()+' ▶':COVER.unlock()}</div></div></button>`;

}
function bindChapterCards(){main.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{if(b.classList.contains('locked')){fx.wrong();return;}startCase(+b.dataset.case);});}

function caseStars(c){ let s=0; c.puzzles.forEach((p,i)=>s+=S.stars[c.id+'-'+i]||0); s+=S.stars[c.id+'-d']||0; s+=S.stars[c.id+'-memory']||0; if(c.id==='c7')Object.keys(S.stars).filter(k=>k.startsWith('c7-world-')).forEach(k=>s+=S.stars[k]); return s; }
function cases(){
  main.dataset.screen='map'; document.body.dataset.scene='world';
  main.innerHTML=`<section class="adventure-map"><div class="map-heading"><div><h1>${COVER.chapters()}</h1><p>${COVER.choose()}</p></div><span class="map-compass" aria-hidden="true">${forestIcon('leaf')}</span></div>${chapterCards()}</section>`;
  bindChapterCards();
}

/* ---------- case runner ---------- */
let R=null;
function startCase(i){
  const c=D.cases[i], steps=[{k:'intro'}];
  if(c.id==='c4') steps.push({k:'shoot'});
  c.puzzles.forEach((p,j)=>steps.push({k:'p',j})); if(c.deduce) steps.push({k:'d'}); steps.push({k:'end'},{k:'cele'});
  R={ci:i, c, step:0, steps, clues:[], earned:0, startTotal:total()}; renderStep();
}
function next(){ R.step++; renderStep(); }
function track(){
  const visible=R.steps.filter(x=>x.k!=='cele'), percent=Math.round(R.step/Math.max(1,visible.length-1)*100);
  const ic={intro:'📖',shoot:'🎯',p:'✦',d:'🔎',end:'🎉'};
  return `<div class="quest-hud"><span class="hud-world">${R.c.place} ${esc(R.c.placeName.t)}</span><span class="hud-score">⭐ ${R.earned}</span></div><div class="track" aria-label="關卡進度 ${percent}%"><div class="track-line"><span style="width:${percent}%"></span></div>${visible.map((x,i)=>`<i class="${i<R.step?'done':i===R.step?'now':''}">${i<R.step?'✔':ic[x.k]}</i>`).join('')}</div>`;
}

function renderStep(){
  main.dataset.screen='play'; document.body.dataset.scene=R.c.special==='birthday'?'magic':'play';
  stopSpeak(); onListen=null; window.scrollTo(0,0); refreshBar();
  const st=R.steps[R.step];
  if (st.k==='intro') story(R.c.intro, '🔍 '+T('startClues'));
  else if (st.k==='p'){ const p=R.c.puzzles[st.j]; ({pick:pPick, tone:pTone, spell:pSpell, read:pRead, match:pMatch, memory:pMemory})[p.type](p, st.j); }
  else if (st.k==='shoot') shootIntro(true);
  else if (st.k==='d') pDeduce();
  else if (st.k==='end') story(R.c.ending, '🎉 '+T('getBadge'));
  else celebrate();
}
const STAGE_BG = {c1:'day', c2:'night', c3:'night', c4:'fest', c5:'sky', c6:'home', c7:'magic'};
function floatStar(x, y, txt='+1 ⭐'){
  const f=document.createElement('div'); f.className='plus'; f.textContent=txt; f.style.left=x+'px'; f.style.top=y+'px';
  document.body.appendChild(f); setTimeout(()=>f.remove(),1300);
  const sp=$('#starpill'); sp.classList.remove('bump'); void sp.offsetWidth; sp.classList.add('bump');
}
function story(lines, lastLabel){
  const kind = R.step===0 ? 'i' : 'e';
  const L = lines.map((l,i)=>({l, key:`${R.c.id}-${kind}${i}`}));  // working copy (choices insert extra lines)
  let li=0;
  function draw(){
    const cur=L[li], ln=cur.l, q=ln.q, c=ln.c;
    let miss=0, answered=false, nagged=false;
    const panel = q
      ? `<div class="qbox" id="qbox"><div class="qhead">🤔 ${T('qHead')}</div><div class="qask">${A(q.ask)} <button class="say" data-t="${esc(q.ask.t)}">🔊</button></div>
           <div class="qopts">${q.options.map((o,i)=>`<button class="qopt nospeak" data-i="${i}"><span class="em">${o.e}</span>${A(o.w,{cls:'keephz'})}</button>`).join('')}</div>
           <div class="qfb" id="qfb"></div></div>`
      : c
      ? `<div class="qbox pickbox" id="qbox"><div class="qhead">👉 ${T('cHead')}</div><div class="qask">${A(c.ask)} <button class="say" data-t="${esc(c.ask.t)}">🔊</button></div>
           <div class="qopts">${c.options.map((o,i)=>`<button class="qopt nospeak" data-i="${i}"><span class="em">${o.e}</span>${A(o.w,{cls:'keephz'})}</button>`).join('')}</div></div>`
      : '';
    main.innerHTML = `<h2 class="casehead">${R.c.place} ${A(R.c.title,{cls:'keephz nospeak'})}</h2>${track()}
      <div class="stagebox ${STAGE_BG[R.c.id]||'day'}" id="stg" role="button" aria-label="再看一次動作">${birthdayStage(ln)}</div>
      <div class="lines"><div class="line paper cur" id="ln${li}">${A(ln,{cls:'grid'})}</div></div>
      ${panel}
      ${q||c?'':`<p class="tip">${T('tip')}</p>`}
      <div class="controls">
        ${li>0?'<button class="say alt" id="sPrev" aria-label="上一句">◀</button>':''}
        <button class="say" id="sOnce">🔊 ${T('readLine')}</button>
        <button class="say alt" id="sSlow">🐢 ${T('slow')}</button>
        <button class="btn ${q?'dim':''}" id="sNext">${li<L.length-1?T('nextLine')+' ▶':lastLabel}</button>
      </div>`;
    const cur$=$('#ln'+li);
    $('#sOnce').onclick=()=>speak(ln.t, cur$, playStage);
    $('#sSlow').onclick=()=>speakWords(cur$, playStage);
    $('#stg').onclick=e=>{ if(!e.target.closest('.actor')) playStage(); };
    if(li>0) $('#sPrev').onclick=()=>{ li--; draw(); };
    const go=()=>{ if(li<L.length-1){ li++; draw(); } else next(); };
    $('#sNext').onclick=()=>{
      if(q && !answered && !nagged){ nagged=true; $('#qbox').scrollIntoView({block:'center',behavior:'smooth'});
        toast('🤔 '+D.ui.qHead.t); $('#sNext').classList.remove('dim'); fx.pop(); return; }
      go();
    };
    if(q) main.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{
      if(answered) return; const i=+b.dataset.i;
      if(i===q.answer){
        answered=true; main.querySelectorAll('.qopt').forEach(x=>x.classList.remove('hint'));
        b.classList.add('right'); fx.ding(); $('#sNext').classList.remove('dim');
        $('#qfb').innerHTML = `🎉 ${A(q.good)}`;
        if(miss===0){ R.combo=(R.combo||0)+1;
          awardStory(cur.key,b);
          if(R.combo>=3 && R.combo%2===1) setTimeout(()=>{ toast(`🔥 ${T('streak1')} ${R.combo} ${T('streak2')}`); fx.fanfare(); },500);
        } else R.combo=0;
        playStage(); speakSeq([{text:praise()},{text:q.good.t}]);
      } else {
        miss++; R.combo=0; fx.wrong(); b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
        $('#qfb').innerHTML = T('qWrong')+' '+T('readFirst');
        speak(D.ph.retry[0].t);
        if(miss>=2) main.querySelector(`.qopt[data-i="${q.answer}"]`).classList.add('hint');
      }
    });
    if(c) main.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{
      const o=c.options[+b.dataset.i];
      main.querySelectorAll('.qopt').forEach(x=>x.disabled=true); b.classList.add('right'); fx.ding();
      awardStory(cur.key,b);
      if(!L[li+1] || !L[li+1].branch) L.splice(li+1, 0, {l:o.res, key:cur.key+'r', branch:true});
      else L[li+1]={l:o.res, key:cur.key+'r', branch:true};
      setTimeout(()=>{ li++; draw(); }, 550);
    });
  }
  draw();
}
function awardStory(key,b){
  R.storyAwarded=R.storyAwarded||new Set();
  if(R.storyAwarded.has(key)) return;
  R.storyAwarded.add(key);
  const fresh=!S.stars[key];
  if(fresh) { S.stars[key]=1; save(); }
  if(fresh || R.c.special==='birthday') {
    R.earned++; refreshBar(); const r=b.getBoundingClientRect(); floatStar(r.left+r.width/2,r.top);
  }
}
function award(key, mistakes, bonus){
  const st = mistakes===0?3:mistakes<=2?2:1;
  const got = st + (bonus?1:0);
  if ((S.stars[key]||0) < got) S.stars[key]=got;
  save(); R.earned += got; refreshBar();
  return {st, bonus};
}
function praise(){ const a=D.ph.praise; return a[Math.random()*a.length|0].t; }
function clueCard(p, res){
  R.clues.push(p.card);
  fx.ding();
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML = `<div class="card">
    <div class="hdr">${A(D.ph.clueGot,{cls:'keephz'})}</div>
    <div class="starsrow">${'⭐'.repeat(res.st)}${res.bonus?`🌟<span class="bonus">${A(D.ph.bonus,{cls:'keephz'})}</span>`:''}</div>
    <div class="em cstage" style="position:relative">${actorHTML([p.card[0],'cheer'])}</div>
    <div class="txt">${A(p.card[1])} <button class="say" data-t="${esc(p.card[1].t)}">🔊</button></div>
    <button class="btn wide" id="ccNext">📒 ${T('collect')} ▶</button></div>`;
  document.body.appendChild(ov);
  const items=[{text:(Math.random()<.35?S.name+'探長，':'')+praise()}];
  if(res.bonus) items.push({text:D.ph.bonus.t});
  const cs=ov.querySelector('.cstage');
  speakSeq(items, ()=>playActor(cs.querySelector('.actor'), cs));
  ov.querySelector('#ccNext').onclick=()=>{ ov.remove(); next(); };
}
function wrongFeedback(el){ fx.wrong(); el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong'); const r=D.ph.retry; speak(r[Math.random()*r.length|0].t); }

function targetUnit(p,si,ci){return p.word.s.slice(0,si).reduce((n,sg)=>n+(sg.ch?.length||0),0)+ci===p.idx;}
function puzzlePrompt(p){return A(p.prompt,{unit:(si,ci)=>p.target && p.prompt.s[si]?.ch?.[ci]?.[0]===p.target[0]?{noZy:true}:{}});}
function pPick(p, idx){
  let mistakes=0, listened=false, done=false;
  onListen=()=>{ listened=true; };
  main.innerHTML = `${track()}
    <div class="prompt paper">${A(p.prompt)} <button class="say" data-t="${esc(p.prompt.t)}">🔊</button></div>
    <div class="note lis">${A(p.clue,{cls:'zyo big'})}<br><button class="say" data-t="${esc(p.clue.t)}">🔊 ${T('hear')}</button></div>
    <div class="opts">${p.options.map((o,i)=>`<button class="opt nospeak" data-i="${i}"><span class="em">${o.e}</span>${A(o.w,{cls:'keephz',noZy:true})}</button>`).join('')}</div>`;
  // options show pictures + characters only (no zhuyin) so the clue must be read
  main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(done) return; const i=+b.dataset.i;
    if(i===p.answer){ done=true; b.classList.add('right'); const res=award(R.c.id+'-'+idx, mistakes, !listened && mistakes===0); setTimeout(()=>clueCard(p,res),500); }
    else { mistakes++; wrongFeedback(b); if(mistakes>=2){ setTimeout(()=>speak(p.clue.t, [...main.querySelectorAll('.note .wd')]),900); } }
  });
  if(S.auto) speak(p.prompt.t);
}
function pRead(p, idx){
  let mistakes=0, listened=false, done=false;
  onListen=()=>{ listened=true; };
  main.innerHTML = `${track()}
    <div class="prompt paper">${A(D.ph.readHelp)} <button class="say" data-t="${esc(D.ph.readHelp.t)}">🔊</button></div>
    <div class="witness" style="margin:16px 0">
      <div class="who">${actorHTML([p.who[0],'nod'])}${A(p.who[1],{cls:'keephz'})}</div>
      <div class="paper lis">${A(p.statement,{cls:'grid zyo'})}<div style="margin-top:10px"><button class="say" data-t="${esc(p.statement.t)}">🔊 ${T('hearWho')}</button></div></div>
    </div>
    <div class="prompt paper">${A(p.question)} <button class="say" data-t="${esc(p.question.t)}">🔊</button></div>
    <div class="opts" style="margin-top:14px">${p.options.map((o,i)=>`<button class="opt nospeak" data-i="${i}"><span class="em">${o.e}</span>${A(o.w)}</button>`).join('')}</div>`;
  main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(done) return; const i=+b.dataset.i;
    if(i===p.answer){ done=true; b.classList.add('right'); const res=award(R.c.id+'-'+idx, mistakes, !listened && mistakes===0); setTimeout(()=>clueCard(p,res),500); }
    else { mistakes++; wrongFeedback(b); if(mistakes>=2) main.querySelector(`.opt[data-i="${p.answer}"]`).classList.add('hint'); }
  });
}
function pMemory(p,idx){
  const deck=p.pairs.flatMap((pair,id)=>[{id,kind:'word',pair},{id,kind:'picture',pair}]);
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  let first=null,busy=false,mistakes=0,matched=0,finished=false;
  main.innerHTML=`${track()}<div class="prompt paper"><div>🪄 ${T('memTitle')}${p.prompt?'<br>'+A(p.prompt):''}</div></div>
    <p class="center">${T('memHow')}</p>
    <div class="magic-score"><span>${T('memFound')} <b id="memCount">0</b> / ${p.pairs.length} ${T('memPair')}</span><span>🧠 ${T('memRemember')}</span></div>
    <div class="memory-arena"><div class="arena-orbit" aria-hidden="true"></div><div class="memory-grid">${deck.map((c,i)=>`<button class="memory-card nospeak" data-memory="${i}" aria-label="翻開第 ${i+1} 張卡"><span class="card-sigil" aria-hidden="true">❧<b>${forestIcon('owl')}</b>❧</span></button>`).join('')}</div></div>
    <div class="memory-status" id="memStatus" aria-live="polite">${T('memStart')}</div>`;

/* ---------- 🎤 speech recognition (read aloud) ---------- */
const SRC = window.SpeechRecognition || window.webkitSpeechRecognition;
let PY=null, pyP=null, curRec=null;
function loadPy(){
  if(PY) return Promise.resolve(PY); if(pyP) return pyP;
  pyP=new Promise(res=>{ const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/pinyin-pro@3.29.4/dist/index.js';
    sc.onload=()=>{ PY=window.pinyinPro||null; res(PY); }; sc.onerror=()=>res(null); document.head.appendChild(sc); setTimeout(()=>res(PY),6000); });
  return pyP;
}
const hanOnly = t => (t||'').replace(/[^\p{Script=Han}]/gu,'');
// pinyin -> zhuyin (for showing what was heard)
const PZ_I=[['zh','ㄓ'],['ch','ㄔ'],['sh','ㄕ'],['b','ㄅ'],['p','ㄆ'],['m','ㄇ'],['f','ㄈ'],['d','ㄉ'],['t','ㄊ'],['n','ㄋ'],['l','ㄌ'],['g','ㄍ'],['k','ㄎ'],['h','ㄏ'],['j','ㄐ'],['q','ㄑ'],['x','ㄒ'],['r','ㄖ'],['z','ㄗ'],['c','ㄘ'],['s','ㄙ']];
const PZ_F={a:'ㄚ',o:'ㄛ',e:'ㄜ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ',er:'ㄦ',ong:'ㄨㄥ',i:'ㄧ',ia:'ㄧㄚ',ie:'ㄧㄝ',iao:'ㄧㄠ',iu:'ㄧㄡ',iou:'ㄧㄡ',ian:'ㄧㄢ',in:'ㄧㄣ',iang:'ㄧㄤ',ing:'ㄧㄥ',iong:'ㄩㄥ',
 u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',ui:'ㄨㄟ',uei:'ㄨㄟ',uan:'ㄨㄢ',un:'ㄨㄣ',uen:'ㄨㄣ',uang:'ㄨㄤ',ueng:'ㄨㄥ',v:'ㄩ',ve:'ㄩㄝ',van:'ㄩㄢ',vn:'ㄩㄣ'};
const PZ_Y={yi:'i',ya:'ia',ye:'ie',yao:'iao',you:'iou',yan:'ian',yin:'in',yang:'iang',ying:'ing',yong:'iong',yu:'v',yue:'ve',yuan:'van',yun:'vn',wu:'u',wa:'ua',wo:'uo',wai:'uai',wei:'uei',wan:'uan',wen:'uen',wang:'uang',weng:'ueng'};
function py2zy(p){
  if(PZ_Y[p]) return PZ_F[PZ_Y[p]]||p;
  let ini='',rest=p; for(const [k,v] of PZ_I) if(p.startsWith(k)){ ini=v; rest=p.slice(k.length); break; }
  if('ㄓㄔㄕㄖㄗㄘㄙ'.includes(ini) && ini && rest==='i') return ini;
  if('ㄐㄑㄒ'.includes(ini) && ini && rest.startsWith('u')) rest='v'+rest.slice(1);
  return ini+(PZ_F[rest]||'');
}
function annRuntime(text){
  if(!PY) return esc(text);
  try{
    const arr=PY.pinyin(text,{type:'all',toneSandhi:false,v:true});
    const ch=arr.filter(o=>o.isZh).map(o=>{ const base=o.pinyin.normalize('NFD').replace(/[\u0300\u0301\u0304\u030C]/g,'').normalize('NFC').replace('ü','v');
      return [o.origin, py2zy(base), {1:'',2:'ˊ',3:'ˇ',4:'ˋ',0:'˙'}[o.num]||'']; });
    return ch.length ? A({t:text, s:[{w:text, ch}]},{cls:'keephz nospeak'}) : esc(text);
  }catch(e){ return esc(text); }
}
async function judge(target, alts){
  await loadPy();
  const tg=hanOnly(target), hs=alts.map(hanOnly).filter(Boolean);
  if(!tg || !hs.length) return {ok:false};
  if(hs.some(h=>h.includes(tg))) return {ok:true, perfect:true};
  if(PY){
    const key=t=>PY.pinyin(t,{toneType:'none',type:'array',v:true});
    const tk=key(tg);
    for(const h of hs){ const hk=key(h); if((' '+hk.join(' ')+' ').includes(' '+tk.join(' ')+' ')) return {ok:true}; }
    if(tk.length>=3) for(const h of hs){ const hk=key(h); if(tk.filter(x=>hk.includes(x)).length>=tk.length-1) return {ok:true}; }
  } else {
    for(const h of hs){ if([...tg].filter(c=>h.includes(c)).length>=Math.ceil(tg.length*.6)) return {ok:true}; }
  }
  return {ok:false};
}
function listen(cb){
  if(!SRC){ cb({err:'nosr'}); return; }
  stopSpeak(); if(curRec){ try{curRec.abort()}catch(e){} }
  const r=new SRC(); curRec=r; r.lang='zh-TW'; r.interimResults=false; r.maxAlternatives=5; r.continuous=false;
  let done=false; const fin=x=>{ if(done) return; done=true; curRec=null; cb(x); };
  r.onresult=e=>fin({alts:[...e.results[0]].map(x=>x.transcript)});
  r.onerror=e=>fin({err:e.error||'err'});
  r.onend=()=>fin({alts:[]});
  try{ r.start(); }catch(e){ fin({err:'start'}); }
  setTimeout(()=>{ try{ r.stop(); }catch(e){} }, 6000);
}
function micTry(btn, target, fb, onOk, onFail){
  if(btn.classList.contains('on')) return;
  loadPy();
  const orig=btn.innerHTML; btn.classList.add('on'); btn.innerHTML='👂 '+T('listening'); fb.innerHTML='';
  listen(res=>{
    btn.classList.remove('on'); btn.innerHTML=orig;
    if(res.err){
      fb.innerHTML = /not-allowed|service|start|nosr|audio-capture/.test(res.err) ? '🎤 '+T('vBlocked') : '👂 '+T('vNoSpeech');
      fx.wrong(); onFail&&onFail(); return;
    }
    judge(target, res.alts).then(j=>{
      if(j.ok){ fb.innerHTML='🎉 '+T(j.perfect?'vPerfect':'vOk'); fx.ding(); onOk(j); }
      else { fb.innerHTML = res.alts.length ? `👂 ${T('vHeard')} <b>${annRuntime(hanOnly(res.alts[0])||res.alts[0])}</b><br>${T('vTry')}` : '👂 '+T('vNoSpeech'); fx.wrong(); onFail&&onFail(); }
    });
  });
}

}
function shootPlay(inCase){
  const POOL = VOCAB(); const NEED=5;
  let hits=0, time=30, target=null, last='', combo=0, clock=null, raf=0, over=false, shots=[], balloons=[], nextId=0, sinceGold=0;
  main.innerHTML = `<div class="sl-hud"><span class="sl-time">⏱ <b id="slTime">30</b></span><span class="sl-hits">${Array.from({length:NEED},(_,i)=>`<i data-h="${i}">🎈</i>`).join('')}</span><span class="sl-combo" id="slCombo"></span></div>
    <div class="sl-q"><span class="sl-qz" id="slWord"></span><button class="say" id="slHear" aria-label="聽">🔊</button></div>
    <div class="sl-arena" id="arena"><div class="sl-sky"></div>
      <svg class="sl-bands" id="bands"><line id="bL"/><line id="bR"/><line id="aim" class="aim"/></svg>
      <div class="sl-sling"><svg viewBox="0 0 100 120"><path d="M50 118 L50 64 M50 64 L18 14 M50 64 L82 14" stroke="#8A5A2B" stroke-width="14" stroke-linecap="round" fill="none"/></svg></div>
      <div class="sl-ammo" id="ammo">🥨</div>
      <p class="sl-tip">${T('shootTip')}</p></div>`;
  const arena=$('#arena'), ammo=$('#ammo');
  const AW=()=>arena.clientWidth, AH=()=>arena.clientHeight;
  const rest=()=>({x:AW()/2, y:AH()-118});
  function placeAmmo(p){ ammo.style.left=p.x+'px'; ammo.style.top=p.y+'px'; }
  function bands(p){ const L={x:AW()/2-30,y:AH()-128}, Rr={x:AW()/2+30,y:AH()-128};
    const set=(id,a,b)=>{ const l=$('#'+id); l.setAttribute('x1',a.x); l.setAttribute('y1',a.y); l.setAttribute('x2',b.x); l.setAttribute('y2',b.y); };
    set('bL',L,p); set('bR',Rr,p); }
  placeAmmo(rest()); bands(rest());
  $('#slHear').onclick=()=>target && speak(target[0]);
  function hud(){ if(!$('#slTime')) return; $('#slTime').textContent=time; main.querySelectorAll('.sl-hits i').forEach((e,i)=>e.classList.toggle('on',i<hits));
    $('#slCombo').innerHTML = combo>=2 ? `🔥 ${T('combo')} ×${combo}` : ''; }
  function newTarget(){ do { target=POOL[Math.random()*POOL.length|0]; } while(target[0]===last); last=target[0];
    $('#slWord').innerHTML=A(W(target[0]),{cls:'zyo nospeak'}); }
  const COLORS=['#FF6B6B','#4FA8E8','#FFC93C','#7BD389','#B983FF','#FF9F45'];
  function spawn(kind){ // kind: 'target' | 'decoy' | 'gold'
    let w;
    if(kind==='target') w=target; else if(kind==='gold') w=['⏱','⏱'];
    else { const used=new Set(balloons.map(b=>b.w[0])); do { w=POOL[Math.random()*POOL.length|0]; } while(w[0]===target[0]||used.has(w[0])); }
    const el=document.createElement('button'); el.className='sl-bal'+(kind==='gold'?' gold':'');
    el.innerHTML=`<span class="sl-skin" style="--bc:${kind==='gold'?'#FFD84D':COLORS[nextId%COLORS.length]}"><span class="sl-em">${w[1]}</span></span><span class="sl-str"></span>`;
    arena.appendChild(el);
    const lanes=[0.14,0.38,0.62,0.86]; const lane=lanes[nextId%4];
    const b={id:nextId++, el, w, kind, x:AW()*lane + (Math.random()*30-15), y: balloons.length<4 ? AH()*(.35+Math.random()*.35) : AH()+40+Math.random()*60, vy:-(44+Math.random()*22+hits*4), phase:Math.random()*6, dead:false};
    el.onclick=e=>{ e.stopPropagation(); fireAt(b.x, b.y-30); };
    balloons.push(b);
  }
  function ensure(){
    if(!balloons.some(b=>!b.dead && b.kind==='target')) spawn('target');
    while(balloons.filter(b=>!b.dead && b.kind!=='target').length<3) spawn('decoy');
    sinceGold++; if(sinceGold>420 && Math.random()<.01){ sinceGold=0; spawn('gold'); }
  }
  // ---- slingshot input
  let pulling=false, pull={x:0,y:0};
  arena.addEventListener('pointerdown',e=>{ if(over || e.target.closest('.sl-bal')) return; const r=arena.getBoundingClientRect(); const p={x:e.clientX-r.left,y:e.clientY-r.top};
    const s=rest(); if(Math.hypot(p.x-s.x,p.y-s.y)<120){ pulling=true; arena.setPointerCapture(e.pointerId); move(e); } else fireAt(p.x,p.y); });
  arena.addEventListener('pointermove',e=>{ if(pulling) move(e); });
  arena.addEventListener('pointerup',e=>{ if(!pulling) return; pulling=false; const s=rest(); const dx=s.x-pull.x, dy=s.y-pull.y;
    $('#aim').style.opacity=0; placeAmmo(s); bands(s);
    if(Math.hypot(dx,dy)>18) launch(s, dx, dy); });
  function move(e){ const r=arena.getBoundingClientRect(), s=rest(); let dx=e.clientX-r.left-s.x, dy=e.clientY-r.top-s.y; const L=Math.hypot(dx,dy), M=95;
    if(L>M){ dx=dx/L*M; dy=dy/L*M; } if(dy<0) dy=Math.max(dy,-10);
    pull={x:s.x+dx,y:s.y+dy}; placeAmmo(pull); bands(pull);
    const a=$('#aim'); a.style.opacity=.9; a.setAttribute('x1',s.x); a.setAttribute('y1',s.y); a.setAttribute('x2',s.x-dx*6); a.setAttribute('y2',s.y-dy*6); }
  function fireAt(x,y){ const s=rest(); launch(s, x-s.x, y-s.y); }
  function launch(s,dx,dy){ if(over) return; const L=Math.hypot(dx,dy)||1, sp=900;
    const el=document.createElement('span'); el.className='sl-shot'; el.textContent='🥨'; arena.appendChild(el);
    shots.push({el,x:s.x,y:s.y,vx:dx/L*sp,vy:dy/L*sp,r:0}); sfx('whoosh'); }
  // ---- game loop
  let lastT=performance.now();
  function loop(t){ if(!$('#arena')){ cancelAnimationFrame(raf); return; }
    const dt=Math.min(.05,(t-lastT)/1000); lastT=t; ensure();
    balloons.forEach(b=>{ if(b.dead) return; b.y+=b.vy*dt; b.phase+=dt*2; const x=b.x+Math.sin(b.phase)*14;
      b.el.style.transform=`translate(${x-40}px,${b.y-50}px) rotate(${Math.sin(b.phase)*6}deg)`; b.cx=x;
      if(b.y<-120){ b.dead=true; b.el.remove(); if(b.kind==='target') combo=0, hud(); } });
    shots.forEach(sh=>{ if(sh.dead) return; sh.x+=sh.vx*dt; sh.y+=sh.vy*dt; sh.r+=720*dt; sh.el.style.transform=`translate(${sh.x-18}px,${sh.y-18}px) rotate(${sh.r}deg)`;
      if(sh.x<-40||sh.x>AW()+40||sh.y<-60){ sh.dead=true; sh.el.remove(); return; }
      const hit=balloons.find(b=>!b.dead && Math.hypot(sh.x-b.cx, sh.y-(b.y-14))<46);
      if(hit){ sh.dead=true; sh.el.remove(); pop(hit); } });
    balloons=balloons.filter(b=>!b.dead || b.el.isConnected); shots=shots.filter(s=>!s.dead);
    raf=requestAnimationFrame(loop); }
  function burst(b, good){ const p=document.createElement('span'); p.className='sl-pop'+(good?' good':''); p.innerHTML=good?BUB('砰！'):'💨';
    p.style.left=b.cx+'px'; p.style.top=(b.y-30)+'px'; arena.appendChild(p); setTimeout(()=>p.remove(),700);
    for(let i=0;i<10;i++){ const c=document.createElement('i'); c.className='sl-conf'; c.style.left=b.cx+'px'; c.style.top=(b.y-20)+'px';
      c.style.setProperty('--dx',(Math.random()*160-80)+'px'); c.style.setProperty('--dy',(Math.random()*-120)+'px'); c.style.background=COLORS[i%6];
      arena.appendChild(c); setTimeout(()=>c.remove(),700); } }
  function pop(b){ b.dead=true; b.el.classList.add('popped'); setTimeout(()=>b.el.remove(),250);
    if(b.kind==='gold'){ time+=5; burst(b,true); sfx('twinkle'); toast('⏱ '+T('plusTime')); hud(); return; }
    if(b.kind==='target'){
      hits++; combo++; burst(b,true); sfx('boing'); fx.ding(); speak(target[0]);
      arena.classList.remove('shake'); void arena.offsetWidth; arena.classList.add('shake'); hud();
      if(hits>=NEED){ over=true; clearInterval(clock); setTimeout(()=>{ cancelAnimationFrame(raf); shootWin(inCase); },900); return; }
      newTarget(); balloons.forEach(x=>{ if(!x.dead && x.kind!=='gold'){ x.dead=true; x.el.classList.add('fly'); setTimeout(()=>x.el.remove(),400); } });
    } else { combo=0; burst(b,false); sfx('wobble'); speak(b.w[0]); hud(); }
  }
  clock=setInterval(()=>{ if(over) return; time--; hud(); if(time<=0){ over=true; clearInterval(clock); cancelAnimationFrame(raf); setTimeout(()=>shootLose(inCase,hits),300); } },1000);
  window._arcadeStop=()=>{ over=true; clearInterval(clock); cancelAnimationFrame(raf); };
  newTarget(); hud(); raf=requestAnimationFrame(loop);
}

  let quiz=shuf(L.words).slice(0,5); while(quiz.length<5) quiz.push(shuf(L.words)[0]);

  const finSay=()=>[...fin].map(symbol=>({symbol})).concat([{text:FINREP[fin],rate:.75},{text:FINREP[fin],rate:.75}]);
  const blendSay=w=>[...(w.ini?[{symbol:w.ini}]:[]),{text:FINREP[w.fin],rate:.7}, ...sayChar(w)];
  function frame(step, inner){
    main.innerHTML=`<div class="mon-level" style="--fc:${famC.c};--fd:${famC.d}">

function jyExam(){
  const qs=shuf(D.jy).map((L,i)=>{ const w=shuf(L.words.filter(x=>x.ini))[0]||shuf(L.words)[0]; return {L, w, type: i%2 ? 'miss' : 'hear'}; });
  let qi=0; const results=[];
  function draw(){
    if(qi>=qs.length) return report();
    const {L,w,type}=qs[qi], fam=L.fin[0], famC=MFAM[fam];
    let opts, body;
    if(type==='hear'){
      const pool=[...(FIN_CONF2[w.fin]||[]).map(f=>[w.ini+f,w.tn]), ...shuf(D.jy.flatMap(l=>l.words).filter(x=>x.fin===w.fin&&x.ini&&x.ini!==w.ini)).map(x=>[x.ini+x.fin,x.tn])];
      const uniq=pool.filter((o,i,a)=>o[0]!==w.ini+w.fin && a.findIndex(y=>y[0]===o[0])===i).slice(0,3);
      opts=shuf([[w.ini+w.fin,w.tn,1],...uniq.map(o=>[o[0],o[1],0])]);
      body=`<p class="mon-say">${T('exHear')} <button class="say" id="exHear">🔊</button></p>`;
    } else {
      const fins=shuf([w.fin, ...(FIN_CONF2[w.fin]||[]), ...shuf(D.jy.map(l=>l.fin).filter(f=>f!==w.fin))]).filter((f,i,a)=>a.indexOf(f)===i);
      const pick=[w.fin, ...fins.filter(f=>f!==w.fin).slice(0,3)];
      opts=shuf(pick.map(f=>[f,'',f===w.fin?1:0]));
      body=`<p class="mon-say">${T('exMiss')} <button class="say" id="exHear">🔊</button></p>
        <div class="ex-word"><span class="mres-em">${w.e}</span>${A(w.a,{cls:'huge keephz nospeak', unit:(si,ci)=>{ let k=0; for(let s=0;s<si;s++) k+=(w.a.s[s].ch||[]).length; return k+ci===w.idx?{slots:{ini:w.ini||'　',fin:null,tone:w.tn}}:{}; }})}</div>`;
    }
    main.innerHTML=`<div class="mon-level ex-level" style="--fc:${famC.c};--fd:${famC.d}">
      <div class="ex-bar"><div style="width:${qi/qs.length*100}%"></div></div>
      <div class="mon-q">📝 ${qi+1} / ${qs.length}</div>${body}
      <div class="mon-cards">${opts.map(o=>`<button class="mcard full" data-ok="${o[2]}">${zyCard(o[0],o[1])}</button>`).join('')}</div></div>`;
    const hear=()=>speakSeq(sayChar(w));
    $('#exHear').onclick=hear; if(type==='hear') setTimeout(hear,300);
    main.querySelectorAll('.mcard').forEach(b=>b.onclick=()=>{
      main.querySelectorAll('.mcard').forEach(x=>x.disabled=true);
      const ok=b.dataset.ok==='1'; results.push({fin:L.fin, ok, w});
      b.classList.add(ok?'pick-ok':'pick-no'); main.querySelector('.mcard[data-ok="1"]').classList.add('pick-ok');
      ok?fx.ding():fx.wrong(); speak(w.a.t);
      setTimeout(()=>{ qi++; draw(); }, ok?1100:1900);
    });
  }
  function report(){
    const right=results.filter(r=>r.ok).length, wrong=results.filter(r=>!r.ok);
    if(right>(S.jyExam||0)){ S.jyExam=right; save(); }
    const st=right>=20?3:right>=15?2:right>=10?1:0; if(st>(S.stars['jy-exam']||0)){ S.stars['jy-exam']=st; save(); refreshBar(); }
    main.innerHTML=`<div class="card mon-end ex-report" style="--fc:#FF9F45;--fd:#E07B1E;margin:14px auto">
      <div class="mon-wrap ${right>=15?'yum':''}">${monsterSVG('ㄧ')}</div>
      <div class="txt">${T('exScore')}<br><b class="ex-big">${right}</b> / ${results.length} ${T('exPts')}</div>
      <div class="starsrow">${'⭐'.repeat(st)||'💪'}</div>
      ${wrong.length?`<p class="mon-say">${T('exWrong')}</p><div class="ex-wrong">${wrong.map(r=>`<button class="mon-node" data-fin="${r.fin}" style="--fc:${MFAM[r.fin[0]].c};--fd:${MFAM[r.fin[0]].d}">${zyCard(r.fin,'')}<span class="mon-st">${r.w.e}</span></button>`).join('')}</div>`
        :`<div class="rankup">🏆 ${T('exPerfect')}</div>`}
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="exAgain">📝 ${T('exRetry')}</button><button class="btn ghost" id="exMap">🗺️ ${T('mMap')}</button></div></div>`;
    main.querySelectorAll('.ex-wrong .mon-node').forEach(b=>b.onclick=()=>monsterLevel(b.dataset.fin));
    $('#exAgain').onclick=jyExam; $('#exMap').onclick=monsterMap;
    fx.fanfare(); if(right>=15) confetti();
  }
  draw();
}

  $('#aGo').onclick=arcadePlay;
}
function arcadePlay(){
  const POOL = VOCAB();
  let score=0, combo=0, time=45, target=null, busy=false, stayT=null, clock=null, last='';
  main.innerHTML = `<div class="ahud"><span>⏱ <b id="aTime">45</b></span><span>🎯 <b id="aScore">0</b></span><span id="aCombo"></span></div>
    <div class="atarget"><span class="em" id="aEm"></span><span class="aword" id="aWord"></span><button class="say" id="aHear" aria-label="聽">🔊</button></div>
    <div class="holes">${Array.from({length:6},(_,i)=>`<div class="hole" id="h${i}"><button class="mole" data-i="${i}"><span class="sign"></span><span class="critter">🐹</span></button></div>`).join('')}</div>`;
  $('#aHear').onclick=()=>target && speak(target[0]);
  function down(){ main.querySelectorAll('.mole.up').forEach(m=>m.classList.remove('up','hitme','no','showme')); }
  function round(){
    if(time<=0 || !$('#h0')) return; busy=false; down(); clearTimeout(stayT);
    do { target = POOL[Math.random()*POOL.length|0]; } while (target[0]===last); last=target[0];
    const others = POOL.filter(x=>x[0]!==target[0]).sort(()=>Math.random()-.5).slice(0,2);
    const words=[target,...others].sort(()=>Math.random()-.5);
    // one mole per column so all three are always side by side and visible
    const rows=[0,1].sort(()=>Math.random()-.5);
    const holes=[0,1,2].sort(()=>Math.random()-.5).map((col,k)=>col + 3*rows[k%2]);
    if(!$('#aEm')) return; $('#aEm').textContent=target[1]; $('#aWord').textContent=target[0];
    setTimeout(()=>{
      if(time<=0 || !$('#h0')) return;
      holes.forEach((h,k)=>{ const m=$('#h'+h+' .mole'); m.dataset.w=words[k][0];
        m.querySelector('.sign').innerHTML=A(W(words[k][0]),{cls:'zyo nospeak'}); m.classList.add('up'); });
    },200);
    stayT=setTimeout(()=>{
      combo=0; hud();
      if(!$('#h0')) return;
      const right=[...main.querySelectorAll('.mole.up')].find(m=>m.dataset.w===target[0]);
      if(right){ right.classList.add('showme'); speak(target[0]); }
      setTimeout(round, 1100);
    }, Math.max(4000, 7000 - score*80));
  }
  function hud(){ if(!$('#aScore')) return; $('#aScore').textContent=score; $('#aTime').textContent=time; $('#aCombo').textContent = combo>=2 ? `🔥×${combo}` : ''; }
  main.querySelectorAll('.mole').forEach(m=>m.onclick=e=>{
    if(!m.classList.contains('up') || busy || time<=0) return;
    if(m.dataset.w===target[0]){
      busy=true; combo++; const pts = 1 + (combo>=3?1:0); score+=pts; hud();
      m.classList.add('hitme','showme'); sfx('boing');
      const r=m.getBoundingClientRect(); floatStar(r.left+r.width/2, r.top, `+${pts}`);
      speak(target[0]);
      clearTimeout(stayT); setTimeout(round, 1200);
    } else {
      combo=0; hud(); m.classList.remove('no'); void m.offsetWidth; m.classList.add('no'); sfx('wobble');
      speak(m.dataset.w);
    }
  });
  clock=setInterval(()=>{ time--; hud(); if(time<=0){ clearInterval(clock); clearTimeout(stayT); down(); arcadeEnd(score); } },1000);
  window._arcadeStop=()=>{ clearInterval(clock); clearTimeout(stayT); time=0; };
  round();
}
function arcadeEnd(score){
  const rec = score>(S.best||0); if(rec) S.best=score;
  const st=Math.min(15, Math.floor((S.best||0)/3)); const gain=st-(S.stars.arcade||0);
  if(gain>0) S.stars.arcade=st; save(); refreshBar();
