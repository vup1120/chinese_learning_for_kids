    <label>發音的聲音<select id="fVoice">${zs.length? zs.map(v=>`<option value="${esc(v.name)}" ${voice&&v.name===voice.name?'selected':''}>${esc(v.name)}（${esc(v.lang)}）</option>`).join('') : '<option>（系統預設）</option>'}</select></label>
    <p class="muted">建議選「台灣」或 zh-TW 的聲音，發音最接近課本。</p>
    <label>說話速度：<span id="rv">${S.rate}</span><input type="range" id="fRate" min="0.6" max="1.1" step="0.05" value="${S.rate}"></label>
    <button class="btn ghost" id="fTest">🔊 試聽</button>
    <label class="check"><input type="checkbox" id="fAuto" ${S.auto?'checked':''}> 換頁時自動念出來（不建議，會少了自己讀的練習）</label>
    <hr style="border:0;border-top:1px dashed var(--kraft2);width:100%">
    <button class="btn ghost" id="fReset">🗑️ 清除進度，從頭開始</button>
    <p class="muted">進度只存在這台裝置的瀏覽器裡。</p></div>`;
  $('#fName').oninput=e=>{ S.name=e.target.value.trim()||'以琴'; save(); refreshBar(); };
  $('#fVoice').onchange=e=>{ S.voice=e.target.value; save(); chooseVoice(); speak('你好，我是安安，以琴探長的小幫手。'); };
  $('#fRate').oninput=e=>{ S.rate=+e.target.value; $('#rv').textContent=S.rate; save(); };
  $('#fTest').onclick=()=>speak('探長好，我是安安。媽，麻，馬，罵。');
  $('#fAuto').onchange=e=>{ S.auto=e.target.checked; save(); };
  $('#fReset').onclick=()=>{ if(confirm('確定要清除所有星星和徽章嗎？')){ S.stars={}; S.done={}; save(); refreshBar(); nav('home'); } };
}

// Keep original birthday content and attach only the picturebook presentation.
function decorateBirthday(){
  if(main.dataset.screen==='play' && R?.c.special==='birthday' && !main.querySelector(':scope > .birthday-book')){
    const book=document.createElement('div');book.className='birthday-book';
    while(main.firstChild)book.appendChild(main.firstChild);main.appendChild(book);
  }
  main.querySelectorAll('.ann .u').forEach(el=>{if(el.closest('button,.nospeak'))return;const hz=el.querySelector('.hz');if(!hz)return;el.setAttribute('role','button');el.tabIndex=0;el.setAttribute('aria-label','朗讀'+hz.textContent);});
}
new MutationObserver(decorateBirthday).observe(main,{childList:true});
document.addEventListener('keydown',e=>{const el=e.target.closest('.ann .u[role="button"]');if(el && (e.key==='Enter'||e.key===' ')){e.preventDefault();speak(el.querySelector('.hz').textContent,el);}});

$('#modeZi').innerHTML=T('mode'); setMode(!!S.zyOnly); refreshBar(); home();
</script>

<button type="button" class="zhh-launch" id="zhh-launch" aria-haspopup="dialog" aria-controls="zhh-modal" aria-expanded="false" aria-label="開啟注音小幫手"><span class="zhh-badge" aria-hidden="true">ㄅㄆ</span><span id="zhh-launch-label"></span></button>
<dialog class="zhh-modal" id="zhh-modal" aria-labelledby="zhh-title" aria-describedby="zhh-hint">
 <section class="zhh-panel">
  <div class="zhh-top"><h2 id="zhh-title"></h2><button type="button" class="zhh-close" id="zhh-close" aria-label="收起注音小幫手">×</button></div>
  <p class="zhh-hint" id="zhh-hint"></p>
  <div id="zhh-groups"></div>
  <p class="zhh-status" id="zhh-status" role="status" aria-live="polite"></p>
  <small style="display:block;margin-top:6px;font-size:12px;color:#44464e">音源：<a href="https://language.moe.gov.tw/001/Upload/files/SITE_CONTENT/M0001/deploy/index.html" target="_blank" rel="noopener">教育部</a> · <a href="https://creativecommons.org/licenses/by/4.0/deed.zh_TW" target="_blank" rel="noopener">CC BY 4.0</a> · 已放慢及調整音量</small>
 </section>
</dialog>
<script>
(() => {
  const launcher=document.getElementById('zhh-launch'), modal=document.getElementById('zhh-modal');
  const status=document.getElementById('zhh-status'), groups=document.getElementById('zhh-groups');
  const label=(text,reading)=>homeZh(text,reading);
  document.getElementById('zhh-launch-label').innerHTML=label('小幫手','ㄒㄧㄠˇ ㄅㄤ ㄕㄡˇ');
  document.getElementById('zhh-title').innerHTML=label('注音小幫手','ㄓㄨˋ ㄧㄣ ㄒㄧㄠˇ ㄅㄤ ㄕㄡˇ');
  document.getElementById('zhh-hint').innerHTML=label('點注音，聽發音。點外面，收起來。','ㄉㄧㄢˇ ㄓㄨˋ ㄧㄣ ㄊㄧㄥ ㄈㄚ ㄧㄣ ㄉㄧㄢˇ ㄨㄞˋ ㄇㄧㄢˋ ㄕㄡ ㄑㄧˇ ㄌㄞˊ');
  const sections=[['聲母','ㄕㄥ ㄇㄨˇ','ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ'],['介音','ㄐㄧㄝˋ ㄧㄣ','ㄧㄨㄩ'],['韻母','ㄩㄣˋ ㄇㄨˇ','ㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ']];
  groups.innerHTML=sections.map(([name,reading,symbols])=>`<section class="zhh-group"><h3>${label(name,reading)}</h3><div class="zhh-keys">${[...symbols].map(z=>`<button type="button" class="zhh-key" data-zhh-symbol="${z}" aria-label="聽 ${z} 的發音" aria-pressed="false">${z}</button>`).join('')}</div></section>`).join('');
  let lastFocus=null, audioContext=null, activeSound=null, playbackId=0;
  const recordings=new Map();
  function getAudioContext(){
    if(!audioContext){const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)throw Error('Audio unavailable');audioContext=new AudioCtx();}
    return audioContext;
  }
  function recordingURL(symbol){return new URL('assets/zhuyin/'+symbol.codePointAt(0).toString(16)+'.mp3',document.baseURI).href;}
  function loadRecording(symbol){
    if(!recordings.has(symbol)){
      const request=fetch(recordingURL(symbol)).then(response=>{if(!response.ok)throw Error('Audio unavailable');return response.arrayBuffer();}).then(data=>getAudioContext().decodeAudioData(data)).catch(error=>{recordings.delete(symbol);throw error;});
      recordings.set(symbol,request);
    }
    return recordings.get(symbol);
  }
  function stopRecording(){
    playbackId++;
    if(!activeSound)return;
    const {source,gain,resolve}=activeSound, now=audioContext.currentTime;
    gain.gain.cancelScheduledValues(now);gain.gain.setValueAtTime(gain.gain.value,now);gain.gain.linearRampToValueAtTime(0,now+0.015);
    try{source.stop(now+0.02);}catch(error){}
    activeSound=null;
    resolve(false);
  }
  function playRecording(symbol){
    stopRecording();const id=playbackId;
    let context;
    try{context=getAudioContext();}catch(error){return Promise.reject(error);}
    // Resume inside the tap handler so iOS can authorize this audio context.
    return Promise.all([context.resume(),loadRecording(symbol)]).then(([,buffer])=>{
      if(id!==playbackId)return false;
      return new Promise(resolve=>{
      const source=context.createBufferSource(),gain=context.createGain(),now=context.currentTime;
      source.buffer=buffer;source.connect(gain);gain.connect(context.destination);
      gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(0.9,now+0.015);
      gain.gain.setValueAtTime(0.9,now+Math.max(0.015,buffer.duration-0.025));gain.gain.linearRampToValueAtTime(0,now+buffer.duration);
      const sound={source,gain,resolve};activeSound=sound;
      source.onended=()=>{source.disconnect();gain.disconnect();if(activeSound===sound)activeSound=null;resolve(true);};
      source.start(now);
      });
    });
  }
  // All game screens share the same decoded recordings and cancellation lifecycle.
  window.zhuyinAudio={play:playRecording,stop:stopRecording};
  launcher.addEventListener('click',()=>{
    if(modal.open){modal.close();return;}
    lastFocus=document.activeElement;status.textContent='';
    groups.querySelectorAll('[aria-pressed="true"]').forEach(b=>b.setAttribute('aria-pressed','false'));
    modal.showModal();launcher.setAttribute('aria-expanded','true');document.body.classList.add('zhh-scroll-lock');
    document.getElementById('zhh-close').focus();
    // Cache the small recordings; no sound plays until a symbol is tapped.
    if(window.AudioContext||window.webkitAudioContext)SYM.forEach(([symbol])=>loadRecording(symbol).catch(()=>{}));
  });
  document.getElementById('zhh-close').addEventListener('click',()=>modal.close());
  modal.addEventListener('click',event=>{if(event.target===modal)modal.close();});
  modal.addEventListener('close',()=>{
    launcher.setAttribute('aria-expanded','false');document.body.classList.remove('zhh-scroll-lock');
    stopRecording();
    if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true});
  });
  groups.addEventListener('click',event=>{
    const key=event.target.closest('[data-zhh-symbol]');if(!key)return;
    groups.querySelectorAll('[aria-pressed="true"]').forEach(b=>b.setAttribute('aria-pressed','false'));
    key.setAttribute('aria-pressed','true');
    const symbol=key.dataset.zhhSymbol;
    status.textContent=symbol;
    stopSpeak();const id=playbackId;
    playRecording(symbol).catch(()=>{if(modal.open&&id+1===playbackId)status.textContent='聲音尚未載入，請再點一次。';});
  });
})();
</script>
