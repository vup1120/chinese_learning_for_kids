let game=null,audioCtx=null;
function chime(final=false){if(!prefs.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const notes=final?[1046.5,1318.51,1567.98,2093]:[1046.5,1318.51,1567.98];notes.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),at=audioCtx.currentTime+i*.13;o.type='sine';o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.075,at+.006);g.gain.exponentialRampToValueAtTime(.001,at+.5);o.start(at);o.stop(at+.52);o.onended=()=>{o.disconnect();g.disconnect();};});}catch(e){}}
function soundUI(){const b=$('#sound');b.textContent=prefs.sound?'♪':'♪̸';b.setAttribute('aria-label',prefs.sound?'關閉音效':'開啟音效');b.setAttribute('aria-pressed',String(prefs.sound));}
$('#sound').onclick=()=>{prefs.sound=!prefs.sound;save();soundUI();};
function world(copy,step=0,total=12){return `<section class="world" aria-label="冒險地圖，已完成 ${step} 關，共 ${total} 關">${scenery(step,total)}<div class="world-copy"><span class="world-tag">九九乘法 · 雲朵冒險</span><h1>${copy}</h1><p>${game?'每解開一道題目，<br>就往甜點小屋前進一步。':'穿上最喜歡的洋裝，<br>一起找回散落的星星！'}</p></div>${game?'':`<div class="mascot-large">${girl}</div>`}<p class="world-caption">甜點小屋在等你<br>準備好就出發吧！</p></section>`;}
function setup(){game=null;document.body.classList.remove('playing');app.innerHTML=`<div class="layout">${world('小小乘法師，<br>出發囉！')}<section class="card"><div class="eyebrow">LET’S GO ON AN ADVENTURE</div><h2>準備你的冒險</h2><p class="lead">選好名字與乘法表，開始自己的星星之旅。</p><form id="setup-form"><label class="label" for="child-name">小朋友的名字</label><input class="name-input" id="child-name" name="name" maxlength="16" placeholder="例如：以琴" autocomplete="off" value="${safe(prefs.name)}"><fieldset style="border:0;padding:0;margin:0"><legend class="label">今天想練習哪些乘法表？</legend><div class="selection-head"><p class="small" style="margin:0 0 12px">可以一次勾選好幾個</p><button class="link-btn" type="button" id="select-all">全部選取</button></div><div class="table-grid">${Array.from({length:9},(_,i)=>i+1).map(n=>`<label class="table-label"><input type="checkbox" name="table" value="${n}" ${prefs.tables.includes(n)?'checked':''}><span><b>${n}</b><small>的乘法</small></span></label>`).join('')}</div></fieldset><p class="selected-note" id="selection" role="status"></p><div class="mode-row"><span>✦ <b>12</b> 個小關卡</span><span>✦ <b>4</b> 種玩法</span><span>✦ 不限時間</span></div><button class="primary" type="submit" id="start">開始冒險　➜</button></form><p class="setup-footer">答錯可以再試，還有小提示陪你一起想。<br>例如只選 7 和 9，就只練習 7、9 的乘法表。</p></section></div>`;
const tables=()=>[...app.querySelectorAll('[name=table]:checked')].map(e=>Number(e.value));function selection(){const a=tables();$('#selection').textContent=a.length?'這次的題庫：'+a.join('、')+' 的乘法（各乘 1～9）':'請至少勾選一個乘法表。';$('#start').disabled=!a.length;$('#select-all').textContent=a.length===9?'取消全選':'全部選取';}app.querySelectorAll('[name=table]').forEach(c=>c.onchange=selection);$('#select-all').onclick=()=>{const all=tables().length===9;app.querySelectorAll('[name=table]').forEach(c=>c.checked=!all);selection();};$('#setup-form').onsubmit=e=>{e.preventDefault();if(!tables().length)return;prefs.name=$('#child-name').value.trim()||'小小冒險家';prefs.tables=tables();save();startGame();};selection();}
// Balance the selected tables and exhaust each table's facts before repeating.
function buildQuestions(tables,count=12){let order=[],pools=new Map(tables.map(a=>[a,[]]));const questions=[];for(let i=0;i<count;i++){if(!order.length)order=shuffle(tables);const a=order.pop();if(!pools.get(a).length)pools.set(a,shuffle([1,2,3,4,5,6,7,8,9]));const b=pools.get(a).pop();questions.push({a,b,type:['choice','input','missing','groups'][i%4]});}return questions;}
function startGame(review){const qs=review?shuffle(review).map((q,i)=>({...q,type:['choice','input','missing','groups'][i%4]})):buildQuestions(prefs.tables);game={qs,index:0,solved:0,firstTry:0,mistakes:0,wrong:[],roundMiss:0,locked:false,hinted:false,review:!!review};document.body.classList.add('playing');renderQuestion();window.scrollTo({top:0,behavior:'auto'});}
function correct(q){return q.type==='missing'?q.b:q.a*q.b;}
function answerOptions(q){const target=correct(q),max=q.type==='missing'?9:81;const values=new Set([target]);const near=q.type==='missing'?[target-1,target+1,target-2,target+2]:[target-q.a,target+q.a,target-1,target+1,q.a+q.b];for(const n of shuffle(near))if(n>=1&&n<=max&&values.size<4)values.add(n);while(values.size<4)values.add(1+Math.floor(Math.random()*max));return shuffle([...values]);}
const titles={choice:'選出正確的答案',input:'寫下你的答案',missing:'哪個數字躲起來了？',groups:'數一數，甜點共有幾個？'},tags={choice:'星星選答',input:'小屋密碼',missing:'神祕數字',groups:'甜點派對'};
function renderQuestion(){const g=game,q=g.qs[g.index];g.roundMiss=0;g.locked=false;g.hinted=false;const equation=q.type==='missing'?`${q.a} × <span class="blank">?</span> = ${q.a*q.b}`:`${q.a} × ${q.b} = <span class="blank">?</span>`;app.innerHTML=`<div class="play-top"><div class="player-avatar">${girl}</div><div><div class="player-name">${safe(prefs.name)}的冒險</div><div class="small">${prefs.tables.join('、')} 的乘法${g.review?' · 錯題小練習':''}</div></div><div class="score" id="score">★ ${g.solved} / ${g.qs.length}</div><button class="icon-btn" id="settings" aria-label="重新選擇題庫">⚙</button></div><div class="layout play-layout">${world(g.review?'再練一次，<br>你會更熟練！':'下一站：<br>甜點小屋',g.solved,g.qs.length)}<section class="card quest-card ${q.type==='groups'?'groups-question':''}" aria-label="乘法題目"><div class="quest-head"><span class="kind-tag">${tags[q.type]}</span><span class="round-label">第 ${g.index+1} / ${g.qs.length} 關</span></div><div class="progress" role="progressbar" aria-label="闖關進度" aria-valuemin="0" aria-valuemax="${g.qs.length}" aria-valuenow="${g.solved}"><div style="width:${g.solved/g.qs.length*100}%"></div></div><h2 class="question-heading" id="q-title">${titles[q.type]}</h2>${q.type==='groups'?`<p class="group-caption">每盒 ${q.a} 個，共 ${q.b} 盒。</p><div class="groups" aria-label="${q.b} 盒甜點，每盒 ${q.a} 個">${Array.from({length:q.b},()=>`<div class="basket" aria-hidden="true">${'<i class="sweet"></i>'.repeat(q.a)}</div>`).join('')}</div>`:''}<div class="equation" aria-label="${q.type==='missing'?`${q.a} 乘以多少等於 ${q.a*q.b}`:`${q.a} 乘以 ${q.b} 等於多少`}">${equation}</div>${q.type==='input'?'<form class="typed" id="answer-form"><label class="sr-only" for="answer-input">乘法答案</label><input id="answer-input" class="answer-input" type="text" inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2" autocomplete="off" required><button class="primary" type="submit">確認</button></form>':`<div class="answers">${answerOptions(q).map(n=>`<button class="answer" data-answer="${n}" aria-label="答案 ${n}">${n}</button>`).join('')}</div>`}<div class="feedback" id="feedback" role="status" aria-live="polite">慢慢想，你一定可以。</div><button class="help-toggle" id="hint-toggle">✧ 給我一個小提示</button><div class="hint" id="hint" hidden></div><div class="next-wrap"><button class="primary" id="next" hidden>${g.index===g.qs.length-1?'抵達甜點小屋　★':'前進下一格　➜'}</button></div></section></div><p class="game-note">答對收集一顆星星。答錯沒關係，提示會陪你找到答案。</p>`;
$('#settings').onclick=()=>$('#leave').showModal();app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>submitAnswer(Number(b.dataset.answer),b));if($('#answer-form'))$('#answer-form').onsubmit=e=>{e.preventDefault();const v=$('#answer-input').value.trim();if(!/^\d{1,2}$/.test(v))return;submitAnswer(Number(v));};$('#hint-toggle').onclick=showHint;$('#next').onclick=()=>{if(!g.locked||game!==g)return;if(++g.index===g.qs.length)finish();else renderQuestion();};}
function showHint(){if(!game||game.locked)return;game.hinted=true;const q=game.qs[game.index];$('#hint').hidden=false;$('#hint').textContent=q.type==='missing'?`從 ${q.a} 開始，每次加 ${q.a}，數到 ${q.a*q.b}。需要加幾次？`:`每一份有 ${q.a} 個，把 ${q.b} 份加起來：${Array(q.b).fill(q.a).join(' ＋ ')}。`;$('#hint-toggle').hidden=true;}
function submitAnswer(value,button){const g=game;if(!g||g.locked)return;const q=g.qs[g.index],target=correct(q);if(value!==target){g.mistakes++;g.roundMiss++;if(!g.wrong.some(x=>x.a===q.a&&x.b===q.b))g.wrong.push({a:q.a,b:q.b});if(button){button.classList.add('wrong');button.disabled=true;}$('#feedback').textContent='還差一點點，再想一次！';if(g.roundMiss>=2)showHint();if($('#answer-input')){$('#answer-input').value='';$('#answer-input').focus();}return;}
g.locked=true;g.solved++;if(g.roundMiss===0&&!g.hinted)g.firstTry++;if(button)button.classList.add('correct');app.querySelectorAll('.answer,.typed button,.answer-input').forEach(b=>b.disabled=true);$('#hint-toggle').hidden=true;$('#hint').hidden=true;$('#feedback').classList.add('success');$('#feedback').textContent=`答對了！${q.a} × ${q.b} = ${q.a*q.b}，獲得一顆星星。`;$('#score').textContent=`★ ${g.solved} / ${g.qs.length}`;const pos=points[Math.round(g.solved/g.qs.length*12)];$('.map-token').style.transform=`translate(${pos[0]-18}px,${pos[1]-57}px)`;const progress=$('[role=progressbar]');progress.setAttribute('aria-valuenow',g.solved);progress.firstElementChild.style.width=g.solved/g.qs.length*100+'%';$('#next').hidden=false;chime();}
function confetti(){const box=document.createElement('div');box.className='confetti';box.setAttribute('aria-hidden','true');box.innerHTML=Array.from({length:32},(_,i)=>`<i style="left:${Math.random()*100}%;background:${['#b6d6de','#e8b0bb','#ecc76f','#9dc6ac'][i%4]};animation-delay:${Math.random()*.5}s"></i>`).join('');document.body.append(box);setTimeout(()=>box.remove(),2500);}
function finish(){const g=game;document.body.classList.remove('playing');app.innerHTML=`<section class="card result"><div class="eyebrow">ADVENTURE COMPLETE</div><div class="result-art"><span class="trophy" aria-hidden="true">🏆</span>${girl}<span class="trophy" style="font-size:52px" aria-hidden="true">★</span></div><h1>${safe(prefs.name)}，抵達甜點小屋！</h1><p class="lead">你完成了 ${g.qs.length} 道挑戰，找回全部星星。</p><div class="stats"><div><b>${g.solved}</b>收集的星星</div><div><b>${g.firstTry} / ${g.qs.length}</b>自己一次答對</div><div><b>${g.wrong.length}</b>值得再練的算式</div></div>${g.wrong.length?`<h2 style="font-size:19px">這幾題，再練一次就更熟了</h2><div class="review-list">${g.wrong.map(q=>`<span class="review-fact">${q.a} × ${q.b} = ${q.a*q.b}</span>`).join('')}</div><button class="primary" id="review">只練這 ${g.wrong.length} 題　➜</button>`:'<p class="lead">今天沒有答錯的題目，太棒了！</p>'}<button class="${g.wrong.length?'secondary':'primary'}" id="again">同樣題庫，再玩一回</button><button class="secondary" id="new-tables">換名字或題庫</button><p class="setup-footer">${prefs.tables.join('、')} 的乘法 · 每次題目重新洗牌</p></section>`;if($('#review'))$('#review').onclick=()=>startGame(g.wrong);$('#again').onclick=()=>startGame();$('#new-tables').onclick=setup;chime(true);confetti();window.scrollTo({top:0,behavior:'auto'});}
$('#stay').onclick=()=>$('#leave').close();$('#leave-confirm').onclick=()=>{$('#leave').close();setup();};save();soundUI();setup();
</script>
</body></html>
