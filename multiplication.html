const pig=`<svg class="pig" viewBox="0 0 150 130" role="img" aria-label="可愛的小豬"><ellipse cx="74" cy="119" rx="54" ry="7" fill="#66865444"/><path d="M126 78q27-23 17-29q-15-7-7 10" fill="none" stroke="#d37e97" stroke-width="5"/><path d="M41 98v20M103 98v20" stroke="#b96c85" stroke-width="12" stroke-linecap="round"/><ellipse cx="75" cy="73" rx="56" ry="43" fill="#f6b5c8" stroke="#c87894" stroke-width="3"/><path d="M28 45L23 10Q50 12 53 39M93 36Q110 8 126 16L116 51" fill="#efa0b9" stroke="#c87894" stroke-width="3"/><ellipse cx="72" cy="84" rx="25" ry="17" fill="#e990ad"/><ellipse cx="63" cy="83" rx="4" ry="6" fill="#a95178"/><ellipse cx="81" cy="83" rx="4" ry="6" fill="#a95178"/><g class="calm-eye" fill="#493844"><ellipse cx="48" cy="61" rx="5" ry="7"/><ellipse cx="97" cy="61" rx="5" ry="7"/><circle cx="49" cy="59" r="2" fill="white"/><circle cx="98" cy="59" r="2" fill="white"/></g><g class="cry-eye"><path d="M36 57l20 7-20 7M107 57l-20 7 20 7" fill="none" stroke="#523645" stroke-width="4"/><path d="M43 73q-20 27 0 27q15 0 0-27M101 73q-15 27 0 27q20 0 0-27" fill="#63c8ed"/><ellipse cx="72" cy="109" rx="11" ry="8" fill="#804363"/></g><path d="M119 85l8 5" stroke="#bb6984" stroke-width="3"/></svg>`;
const hen=`<svg viewBox="0 0 100 110" aria-hidden="true"><path d="M37 85L28 106m37-23 13 20" stroke="#dd8f29" stroke-width="6"/><path d="M23 72L2 37l28 15" fill="#d0ab81"/><ellipse cx="50" cy="65" rx="35" ry="30" fill="#fff3cc" stroke="#9c7352" stroke-width="3"/><circle cx="69" cy="37" r="22" fill="#fff3cc" stroke="#9c7352" stroke-width="3"/><path d="M55 17q-9-24 4-10q5-24 12-3q15-19 12 15" fill="#de5750"/><path d="M88 35l15 12-18 3" fill="#e99b37"/><path d="M67 28l17 7" stroke="#47332c" stroke-width="5"/><circle cx="77" cy="39" r="4" fill="#322c29"/><path d="M42 61q-9 25 20 15" fill="#dfbe8b"/><path d="M79 54q7 20-7 13" fill="#de5750"/></svg>`;
let prefs={name:'',tables:[2,3],sound:true};try{const p=JSON.parse(localStorage.getItem('pig-home-v2'));if(p){prefs.name=String(p.name||'').slice(0,16);prefs.tables=Array.isArray(p.tables)?[...new Set(p.tables.filter(n=>Number.isInteger(n)&&n>=1&&n<=9))]:[2,3];prefs.sound=p.sound!==false;}}catch(e){}
let game=null,state='setup',timer=0,deadline=0,remaining=5000,sequence=0,pending=[],audioCtx;
function later(fn,ms){const token=sequence;const id=setTimeout(()=>{if(token===sequence)fn();},ms);pending.push(id);}
function clearWork(){sequence++;clearInterval(timer);pending.forEach(clearTimeout);pending=[];}
function sound(kind){if(!prefs.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const now=audioCtx.currentTime;const play=(f,at,d=.5,type='triangle',vol=.035)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f,at);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.025);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.connect(g);g.connect(audioCtx.destination);o.start(at);o.stop(at+d+.02);};const chord=(notes,at,d=.75)=>notes.forEach((f,i)=>{play(f,at+i*.025,d,'triangle',.025);play(f/2,at+i*.025,d,'sine',.018);});if(kind==='chase'){[392,349,311,294,262].forEach((f,i)=>play(f,now+i*.13,.18,'square',.018));}else if(kind==='burst'){play(150,now,.7,'sawtooth',.045);play(85,now+.08,.8,'sine',.06);}else if(kind==='angry'){[330,294,262].forEach((f,i)=>play(f,now+i*.16,.22,'square',.018));}else if(kind==='reward5'){chord([523.25,659.25,783.99],now,.9);chord([659.25,783.99,1046.5],now+.38,1.1);}else if(kind==='reward10'){[[523,659,784],[659,784,988],[784,988,1175],[1047,1319,1568]].forEach((n,i)=>chord(n,now+i*.3,1));}else{chord([523.25,659.25,783.99],now,.65);}}catch(e){}}
function hideCinema(){cinematic.className='cinematic';cinematic.innerHTML='';cinematic.style.removeProperty('--inflate');}
function answerStrip(){return '<div class="cinematic-answers">'+[...document.querySelectorAll('.house .number')].map(n=>'<b class="cinematic-answer">'+n.textContent+'</b>').join('')+'</div>';}
function showCinema(cls,title,sub='',answers=false){cinematic.className='cinematic show '+cls;cinematic.innerHTML=(answers?answerStrip():'')+'<div class="cinematic-copy">'+title+(sub?'<span class="cinematic-sub">'+sub+'</span>':'')+'</div>';}
function angryPig(next){cinematic.insertAdjacentHTML('beforeend','<div class="angry-card">哼！你要認真一點啦！<b>看清楚算式，再帶我回正確的家！</b></div>');sound('angry');later(next,1500);}
function jewelRain(){cinematic.insertAdjacentHTML('beforeend','<div class="jewel-rain">'+Array.from({length:36},(_,i)=>'<i style="left:'+(i*19%100)+'%;--j:'+(24+i%5*10)+'px;--d:'+(1.8+i%4*.35)+'s;--delay:'+(-i%9*.21)+'s">'+['💎','💍','👑','🔮','💠'][i%5]+'</i>').join('')+'</div>');}
function rewardScene(level,next){const ten=level===10;showCinema(ten?'reward10':'reward5',ten?'連續答對 10 題！珠寶雨來啦！':'連續答對 5 題！公主魔法變身！',ten?'小豬開心得跳起來，天空撒下滿滿寶石！':'小豬送你皇冠、寶石項鍊和夢幻禮服！');if(ten)jewelRain();else game.princess=true;sound(ten?'reward10':'reward5');later(()=>{hideCinema();next();},ten?5200:4300);}
function buildQuestions(tables,count=10){let order=[],pools=new Map(tables.map(a=>[a,[]]));const qs=[];for(let i=0;i<count;i++){if(!order.length)order=shuffle(tables);const a=order.pop();if(!pools.get(a).length)pools.set(a,shuffle([1,2,3,4,5,6,7,8,9]));qs.push({a,b:pools.get(a).pop()});}return qs;}
function answerOptions(q){const correct=q.a*q.b,s=new Set([correct]);for(const n of shuffle([correct-q.a,correct+q.a,correct-1,correct+1,q.a+q.b]))if(n>0&&n<=81&&s.size<3)s.add(n);while(s.size<3)s.add(1+Math.floor(Math.random()*81));return shuffle([...s]);}
function actors(){$('#party').innerHTML=girl+(game&&game.princess?'<span class="princess-badge" aria-label="公主皇冠與寶石">👑<br>💎</span>':'')+'<div class="leash"></div><div class="pig-wrap">'+pig+'</div>';$('#flock').innerHTML='<div class="hen" style="left:75px;top:5px;transform:scale(1.8)">'+hen+'</div>';}
function houses(options){$('#houses').innerHTML=options.map((n,i)=>`<button class="house" data-answer="${n}" data-door="${18+i*32}" aria-label="答案 ${n} 的家"><svg viewBox="0 0 220 220" aria-hidden="true"><rect x="29" y="76" width="162" height="132" rx="9" fill="${['#ffedc0','#f8d4cd','#d6e8f1'][i]}" stroke="#736f55" stroke-width="4"/><path d="M9 88L109 8L211 88Z" fill="${['#d78468','#8cac86','#789caf'][i]}" stroke="#736f55" stroke-width="4"/><rect x="81" y="140" width="58" height="68" rx="26" fill="#77694f"/><circle cx="124" cy="181" r="4" fill="#f1d98a"/><rect x="46" y="149" width="21" height="26" rx="4" fill="#b6d8dd"/><rect x="151" y="149" width="21" height="26" rx="4" fill="#b6d8dd"/></svg><span class="number">${n}</span></button>`).join('');document.querySelectorAll('.house').forEach(b=>{b.disabled=state!=='playing';b.onclick=()=>choose(Number(b.dataset.answer),Number(b.dataset.door),b);});}
function setup(){clearWork();state='setup';stage.className='';actors();houses([12,18,24]);$('#pause').disabled=true;overlay.classList.remove('hidden');overlay.innerHTML=`<div class="panel"><div id="ready-pig">${pig}</div><h1>小豬快回家！</h1><p>選對房子，帶小豬回家。<br><b>選錯？母雞衝出來追！<br>超過 5 秒？小豬膨脹、砰！眼淚大爆發！</b></p><form id="setup-form"><input id="name" type="text" maxlength="16" aria-label="小朋友的名字" placeholder="小朋友的名字" value="${safe(prefs.name)}"><p style="margin-bottom:0">今天練哪些乘法？</p><div class="tables">${Array.from({length:9},(_,i)=>i+1).map(n=>`<label><input type="checkbox" value="${n}" ${prefs.tables.includes(n)?'checked':''} aria-label="${n} 的乘法"><span>${n}</span></label>`).join('')}</div><div class="minor">一回合 10 題 · 答錯就回原點重試</div><button class="primary" id="start">牽好小豬，出發！</button></form></div>`;const selected=()=>[...overlay.querySelectorAll('input:checked')].map(b=>+b.value);overlay.querySelectorAll('[type=checkbox]').forEach(b=>b.onchange=()=>$('#start').disabled=!selected().length);$('#start').disabled=!selected().length;$('#setup-form').onsubmit=e=>{e.preventDefault();if(!selected().length)return;prefs.name=$('#name').value.trim()||'小小冒險家';prefs.tables=selected();try{localStorage.setItem('pig-home-v2',JSON.stringify(prefs));}catch(e){}game={qs:buildQuestions(prefs.tables),index:0,misses:0,timeouts:0,streak:0,princess:false};$('#player').textContent=prefs.name;countIn();};}
function countIn(){clearWork();state='ready';$('#pause').disabled=true;overlay.classList.remove('hidden');overlay.innerHTML='<div class="panel"><h2>牽好小豬！</h2><p id="countdown">3</p><p>點選答案房子 · 只有 5 秒！</p></div>';later(()=>$('#countdown').textContent='2',650);later(()=>$('#countdown').textContent='1',1300);later(round,1950);}
function round(){clearWork();hideCinema();state='playing';stage.className='';stage.style.removeProperty('--door');actors();$('#party').style.cssText='';$('#tears').innerHTML='';overlay.classList.add('hidden');$('#pause').disabled=false;const q=game.qs[game.index];$('#equation').textContent=`${q.a} × ${q.b} = ?`;$('#score').textContent=`${game.index} / ${game.qs.length}`;$('#status').textContent='';$('#caption').textContent='點選答案房子，快帶小豬回家！';houses(answerOptions(q));remaining=5000;deadline=performance.now()+remaining;tick();timer=setInterval(tick,40);}
function tick(){if(state!=='playing')return;remaining=Math.max(0,deadline-performance.now());const p=remaining/5000;$('#bar').style.transform=`scaleX(${p})`;$('#seconds').textContent=(remaining/1000).toFixed(1)+' 秒';$('.pig-wrap').style.transform=`scaleX(${1+(1-p)*4.2}) scaleY(${1+(1-p)*.28})`;if(p<.62){if(!cinematic.classList.contains('inflate-scene'))showCinema('inflate-scene','快選！小豬快撐不住啦！','越來越胖、皺眉、咬牙、開始爆汗！',true);cinematic.style.setProperty('--inflate',Math.min(.96,(.62-p)*2.45));}if(!remaining)fail('timeout');}
function lock(){clearInterval(timer);document.querySelectorAll('.house').forEach(b=>b.disabled=true);$('#pause').disabled=true;}
function advanceCorrect(){game.index++;const done=game.index===game.qs.length;const proceed=()=>done?finish():round();if(game.streak===5||game.streak===10)rewardScene(game.streak,proceed);else proceed();}
function choose(value,door,button){if(state!=='playing')return;if(performance.now()>=deadline){fail('timeout');return;}lock();const q=game.qs[game.index];stage.style.setProperty('--door',door+'%');$('#party').style.left=door+'%';$('#party').style.bottom='28%';$('.pig-wrap').style.transform='scale(1)';button.classList.add('selected');if(value===q.a*q.b){hideCinema();game.streak++;state='success';stage.className='success';$('#status').textContent='答對了！連續 '+game.streak+' 題！';$('#caption').textContent=`${q.a} × ${q.b} = ${q.a*q.b}，安全到家！`;sound('win');later(advanceCorrect,1100);}else{state='approach';later(()=>fail('wrong'),350);}}
function fail(kind){if(!['playing','approach'].includes(state))return;lock();state=kind;game.misses++;game.streak=0;$('.pig-wrap').classList.add('crying');if(kind==='wrong'){stage.className='chase';showCinema('chase-scene','嗚哇啊啊——！母雞追來啦！','一隻就夠兇！急轉彎、伸長脖子追著小豬跑！');sound('chase');later(()=>angryPig(round),2800);}else{game.timeouts++;stage.className='burst';showCinema('inflate-scene','砰！小豬的眼淚大爆發！','時間到了！下一次要更快找到正確的家！',true);cinematic.style.setProperty('--inflate',1);$('#tears').innerHTML=Array.from({length:65},(_,i)=>`<i class="drop" style="left:${i*1.6}%;--size:${14+i%6*8}px;--delay:${-(i%13)*.09}s;--top:${i%10*10}%"></i>`).join('');sound('burst');later(()=>angryPig(round),1900);}}
function pause(){if(state!=='playing')return;remaining=Math.max(0,deadline-performance.now());clearInterval(timer);state='paused';stage.classList.add('paused');document.querySelectorAll('.house').forEach(b=>b.disabled=true);overlay.classList.remove('hidden');overlay.innerHTML='<div class="panel"><h1>小豬休息中 🐷</h1><p>倒數已暫停。</p><button class="primary" id="resume">繼續找家</button><button id="change" style="margin-top:16px">換名字或乘法表</button></div>';$('#resume').onclick=()=>{overlay.classList.add('hidden');state='playing';stage.classList.remove('paused');deadline=performance.now()+remaining;document.querySelectorAll('.house').forEach(b=>b.disabled=false);tick();timer=setInterval(tick,40);};$('#change').onclick=setup;}
function finish(){clearWork();state='finished';$('#score').textContent=`${game.index} / ${game.qs.length}`;overlay.classList.remove('hidden');overlay.innerHTML=`<div class="panel"><div id="ready-pig">${pig}</div><h1>${safe(prefs.name)}，全部到家！</h1><p>成功帶小豬回家 <b>${game.qs.length}</b> 次！<br>被母雞追了 ${game.misses-game.timeouts} 次<br>眼淚爆發了 ${game.timeouts} 次</p><button class="primary" id="again">再救一次小豬！</button><button id="change" style="margin-top:16px">換名字或乘法表</button></div>`;$('#again').onclick=()=>{game={qs:buildQuestions(prefs.tables),index:0,misses:0,timeouts:0,streak:0,princess:false};countIn();};$('#change').onclick=setup;sound('win');}
$('#pause').onclick=pause;$('#sound').onclick=()=>{prefs.sound=!prefs.sound;$('#sound').textContent=prefs.sound?'♪':'靜音';$('#sound').setAttribute('aria-pressed',String(prefs.sound));};$('#sound').textContent=prefs.sound?'♪':'靜音';document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});document.addEventListener('keydown',e=>{if(e.key==='Escape')pause();if(state==='playing'&&['1','2','3'].includes(e.key)){const b=document.querySelectorAll('.house')[+e.key-1];b.click();}});setup();
</script></html>
