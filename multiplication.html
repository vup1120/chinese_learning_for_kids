.pig-wrap{animation:hop .18s 4 alternate}.burst .party{opacity:0}.burst .boom{display:block}.boom{display:none;position:absolute;left:50%;top:55%;transform:translate(-50%,-50%) rotate(-9deg);font-size:clamp(65px,14vw,170px);font-weight:1000;color:#fff6c7;text-shadow:5px 5px #d5714a;z-index:9}.tears{position:absolute;inset:0;z-index:10;pointer-events:none;overflow:hidden}.drop{position:absolute;top:-20%;width:var(--size);height:calc(var(--size)*1.5);background:#74cbecdd;border:2px solid #d4f8ff;border-radius:65% 35% 65% 45%;transform:rotate(35deg);animation:rain 1.05s linear infinite;animation-delay:var(--delay)}.flood{position:absolute;left:-10%;bottom:-10%;height:0;width:120%;background:#83d5eadd;border-radius:45% 40% 0 0;transition:height 1.5s}.burst .flood{height:62%}.overlay{position:absolute;inset:0;background:#243c365c;backdrop-filter:blur(5px);z-index:20;display:grid;place-items:center;padding:18px}.panel{background:#fff9e9;border:4px solid white;border-radius:28px;width:min(520px,100%);max-height:100%;overflow:auto;padding:26px;text-align:center;box-shadow:0 15px 60px #34473840}.panel h1{font-size:36px;margin:3px 0 12px}.panel p{line-height:1.7}.panel input[type=text]{width:100%;padding:12px;border:2px solid #c5cdb9;border-radius:12px;background:white}.tables{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin:16px 0}.tables label{position:relative}.tables input{position:absolute;opacity:0}.tables span{display:block;border:2px solid #d5d9c5;padding:10px 0;border-radius:10px;font-weight:850}.tables input:checked+span{background:#bddc93;border-color:#6e9d4b}.tables input:focus-visible+span{outline:3px solid #245bbe}.primary{background:#f0ba62;width:100%;margin-top:12px;font-size:20px;box-shadow:0 5px #c18b40}.primary:disabled{opacity:.4}.minor{font-size:14px;color:#617367}.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.hidden{display:none!important}#countdown{font-size:110px;margin:0}#sound,#pause{padding:8px 15px}#status{position:absolute;left:15%;right:15%;top:28%;text-align:center;font-size:21px;font-weight:900;z-index:11;pointer-events:none}#ready-pig{width:120px;height:90px;margin:auto}.paused .party,.paused .hen{animation-play-state:paused}

</style><header><strong>🐷 小豬快回家！</strong><div><a href="index.html">回中文遊戲</a>　<button id="sound" aria-label="切換音效">♪</button></div></header><main id="stage"><div class="cloud"></div><div class="cloud second"></div><div class="hill"></div><div class="hill two"></div><div class="road"></div><div class="hud"><span class="badge" id="player">小豬找家</span><span class="badge" id="score">0 / 10</span><button id="pause">暫停</button></div><div class="question"><small>哪一間才是小豬的家？</small><div class="equation" id="equation">7 × 3 = ?</div><div class="timer"><i id="bar"></i></div><b id="seconds">5.0 秒</b></div><div id="status" role="status" aria-live="polite"></div><div class="houses" id="houses"></div><div class="party" id="party"></div><div class="flock" id="flock"></div><div class="boom">砰！</div><div class="tears" id="tears"></div><div class="flood"></div><div class="caption" id="caption">點選答案房子，快帶小豬回家！</div><div class="overlay" id="overlay"></div></main><script>

const girl=`<svg class="girl" viewBox="0 0 160 250" role="img" aria-label="穿著大耳狗洋裝的小女孩"><ellipse cx="80" cy="240" rx="48" ry="7" fill="#719889" opacity=".2"/><path d="M35 91Q17 25 80 23Q142 25 126 102L130 145Q113 157 107 132H48Q40 161 27 144Z" fill="#594438"/><path d="M59 208V232M101 208V232" stroke="#f5d5be" stroke-width="14"/><ellipse cx="57" cy="233" rx="16" ry="8" fill="#fffef9" stroke="#97b8cd" stroke-width="3"/><ellipse cx="103" cy="233" rx="16" ry="8" fill="#fffef9" stroke="#97b8cd" stroke-width="3"/><path d="M47 131L27 167M113 131L134 157" stroke="#b4d8ed" stroke-width="18" stroke-linecap="round"/><circle cx="26" cy="168" r="9" fill="#f6d8c1"/><circle cx="135" cy="158" r="9" fill="#f6d8c1"/><path d="M47 123Q80 111 113 123L109 152L127 210Q80 229 33 210L51 152Z" fill="#9dc9e3" stroke="#74a8c5" stroke-width="2"/><path d="M48 124Q62 150 80 128Q100 150 112 124" fill="#fffdf8"/><path d="M37 202Q48 215 58 207Q69 221 81 211Q94 221 104 208Q117 216 124 202" fill="none" stroke="#e9f6fa" stroke-width="8"/><path d="M53 169Q23 148 25 178Q28 201 54 180M107 169Q137 148 135 178Q132 201 106 180" fill="#fffefb" stroke="#d5e7ef" stroke-width="1.5"/><ellipse cx="80" cy="173" rx="31" ry="23" fill="#fffefb"/><ellipse cx="68" cy="171" rx="3" ry="5" fill="#62a9cf"/><ellipse cx="92" cy="171" rx="3" ry="5" fill="#62a9cf"/><ellipse cx="58" cy="181" rx="6" ry="3" fill="#efbacb"/><ellipse cx="102" cy="181" rx="6" ry="3" fill="#efbacb"/><path d="M75 182Q80 189 85 182" fill="none" stroke="#62a9cf" stroke-width="2" stroke-linecap="round"/><circle cx="80" cy="77" r="47" fill="#f8ddc7"/><path d="M33 73Q27 25 80 25Q134 25 127 73L114 65L105 73L91 62L80 73L66 62L55 73L44 63Z" fill="#594438"/><path d="M51 48Q61 39 68 41M90 39L109 48" stroke="#715646" stroke-width="3" fill="none"/><ellipse cx="62" cy="81" rx="5" ry="7" fill="#433a35"/><ellipse cx="98" cy="81" rx="5" ry="7" fill="#433a35"/><circle cx="64" cy="78" r="2" fill="#fff"/><circle cx="100" cy="78" r="2" fill="#fff"/><ellipse cx="48" cy="95" rx="10" ry="5" fill="#e9a5a4" opacity=".6"/><ellipse cx="112" cy="95" rx="10" ry="5" fill="#e9a5a4" opacity=".6"/><path d="M70 98Q80 111 90 98Z" fill="#b16d67"/><path d="M72 99H88" stroke="#fff" stroke-width="2"/><path d="M111 32Q137 15 132 36Q148 52 124 48Z" fill="#b0dbed" stroke="#75a7c3" stroke-width="2"/><circle cx="124" cy="36" r="5" fill="#f4cc7b"/></svg>`;

const pig=`<svg class="pig" viewBox="0 0 150 130" role="img" aria-label="可愛的小豬"><ellipse cx="74" cy="119" rx="54" ry="7" fill="#66865444"/><path d="M126 78q27-23 17-29q-15-7-7 10" fill="none" stroke="#d37e97" stroke-width="5"/><path d="M41 98v20M103 98v20" stroke="#b96c85" stroke-width="12" stroke-linecap="round"/><ellipse cx="75" cy="73" rx="56" ry="43" fill="#f6b5c8" stroke="#c87894" stroke-width="3"/><path d="M28 45L23 10Q50 12 53 39M93 36Q110 8 126 16L116 51" fill="#efa0b9" stroke="#c87894" stroke-width="3"/><ellipse cx="72" cy="84" rx="25" ry="17" fill="#e990ad"/><ellipse cx="63" cy="83" rx="4" ry="6" fill="#a95178"/><ellipse cx="81" cy="83" rx="4" ry="6" fill="#a95178"/><g class="calm-eye" fill="#493844"><ellipse cx="48" cy="61" rx="5" ry="7"/><ellipse cx="97" cy="61" rx="5" ry="7"/><circle cx="49" cy="59" r="2" fill="white"/><circle cx="98" cy="59" r="2" fill="white"/></g><g class="cry-eye"><path d="M36 57l20 7-20 7M107 57l-20 7 20 7" fill="none" stroke="#523645" stroke-width="4"/><path d="M43 73q-20 27 0 27q15 0 0-27M101 73q-15 27 0 27q20 0 0-27" fill="#63c8ed"/><ellipse cx="72" cy="109" rx="11" ry="8" fill="#804363"/></g><path d="M119 85l8 5" stroke="#bb6984" stroke-width="3"/></svg>`;
const hen=`<svg viewBox="0 0 100 110" aria-hidden="true"><path d="M37 85L28 106m37-23 13 20" stroke="#dd8f29" stroke-width="6"/><path d="M23 72L2 37l28 15" fill="#d0ab81"/><ellipse cx="50" cy="65" rx="35" ry="30" fill="#fff3cc" stroke="#9c7352" stroke-width="3"/><circle cx="69" cy="37" r="22" fill="#fff3cc" stroke="#9c7352" stroke-width="3"/><path d="M55 17q-9-24 4-10q5-24 12-3q15-19 12 15" fill="#de5750"/><path d="M88 35l15 12-18 3" fill="#e99b37"/><path d="M67 28l17 7" stroke="#47332c" stroke-width="5"/><circle cx="77" cy="39" r="4" fill="#322c29"/><path d="M42 61q-9 25 20 15" fill="#dfbe8b"/><path d="M79 54q7 20-7 13" fill="#de5750"/></svg>`;
let prefs={name:'',tables:[2,3],sound:true};try{const p=JSON.parse(localStorage.getItem('pig-home-v2'));if(p){prefs.name=String(p.name||'').slice(0,16);prefs.tables=Array.isArray(p.tables)?[...new Set(p.tables.filter(n=>Number.isInteger(n)&&n>=1&&n<=9))]:[2,3];prefs.sound=p.sound!==false;}}catch(e){}
let game=null,state='setup',timer=0,deadline=0,remaining=5000,sequence=0,pending=[],audioCtx;
function later(fn,ms){const token=sequence;const id=setTimeout(()=>{if(token===sequence)fn();},ms);pending.push(id);}
function clearWork(){sequence++;clearInterval(timer);pending.forEach(clearTimeout);pending=[];}
function sound(kind){if(!prefs.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const notes=kind==='win'?[523,659,784,1047]:kind==='fail'?[392,311,196]:[220,165,110];notes.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),at=audioCtx.currentTime+i*.1;o.type=kind==='win'?'triangle':'sine';o.frequency.setValueAtTime(f,at);g.gain.setValueAtTime(.06,at);g.gain.exponentialRampToValueAtTime(.001,at+.28);o.connect(g);g.connect(audioCtx.destination);o.start(at);o.stop(at+.3);o.onended=()=>{o.disconnect();g.disconnect();};});}catch(e){}}
function buildQuestions(tables,count=10){let order=[],pools=new Map(tables.map(a=>[a,[]]));const qs=[];for(let i=0;i<count;i++){if(!order.length)order=shuffle(tables);const a=order.pop();if(!pools.get(a).length)pools.set(a,shuffle([1,2,3,4,5,6,7,8,9]));qs.push({a,b:pools.get(a).pop()});}return qs;}
function answerOptions(q){const correct=q.a*q.b,s=new Set([correct]);for(const n of shuffle([correct-q.a,correct+q.a,correct-1,correct+1,q.a+q.b]))if(n>0&&n<=81&&s.size<3)s.add(n);while(s.size<3)s.add(1+Math.floor(Math.random()*81));return shuffle([...s]);}
function actors(){ $('#party').innerHTML=girl+'<div class="leash"></div><div class="pig-wrap">'+pig+'</div>';$('#flock').innerHTML=Array.from({length:8},(_,i)=>`<div class="hen" style="left:${i%4*45}px;top:${Math.floor(i/4)*34}px;animation-delay:${i*.03}s">${hen}</div>`).join('');}
function houses(options){$('#houses').innerHTML=options.map((n,i)=>`<button class="house" data-answer="${n}" data-door="${18+i*32}" aria-label="答案 ${n} 的家"><svg viewBox="0 0 220 220" aria-hidden="true"><rect x="29" y="76" width="162" height="132" rx="9" fill="${['#ffedc0','#f8d4cd','#d6e8f1'][i]}" stroke="#736f55" stroke-width="4"/><path d="M9 88L109 8L211 88Z" fill="${['#d78468','#8cac86','#789caf'][i]}" stroke="#736f55" stroke-width="4"/><rect x="81" y="140" width="58" height="68" rx="26" fill="#77694f"/><circle cx="124" cy="181" r="4" fill="#f1d98a"/><rect x="46" y="149" width="21" height="26" rx="4" fill="#b6d8dd"/><rect x="151" y="149" width="21" height="26" rx="4" fill="#b6d8dd"/></svg><span class="number">${n}</span></button>`).join('');document.querySelectorAll('.house').forEach(b=>{b.disabled=state!=='playing';b.onclick=()=>choose(Number(b.dataset.answer),Number(b.dataset.door),b);});}
function setup(){clearWork();state='setup';stage.className='';actors();houses([12,18,24]);$('#pause').disabled=true;overlay.classList.remove('hidden');overlay.innerHTML=`<div class="panel"><div id="ready-pig">${pig}</div><h1>小豬快回家！</h1><p>選對房子，帶小豬回家。<br><b>選錯？母雞衝出來追！<br>超過 5 秒？小豬膨脹、砰！眼淚大爆發！</b></p><form id="setup-form"><input id="name" type="text" maxlength="16" aria-label="小朋友的名字" placeholder="小朋友的名字" value="${safe(prefs.name)}"><p style="margin-bottom:0">今天練哪些乘法？</p><div class="tables">${Array.from({length:9},(_,i)=>i+1).map(n=>`<label><input type="checkbox" value="${n}" ${prefs.tables.includes(n)?'checked':''} aria-label="${n} 的乘法"><span>${n}</span></label>`).join('')}</div><div class="minor">一回合 10 題 · 答錯就回原點重試</div><button class="primary" id="start">牽好小豬，出發！</button></form></div>`;const selected=()=>[...overlay.querySelectorAll('input:checked')].map(b=>+b.value);overlay.querySelectorAll('[type=checkbox]').forEach(b=>b.onchange=()=>$('#start').disabled=!selected().length);$('#start').disabled=!selected().length;$('#setup-form').onsubmit=e=>{e.preventDefault();if(!selected().length)return;prefs.name=$('#name').value.trim()||'小小冒險家';prefs.tables=selected();try{localStorage.setItem('pig-home-v2',JSON.stringify(prefs));}catch(e){}game={qs:buildQuestions(prefs.tables),index:0,misses:0,timeouts:0};$('#player').textContent=prefs.name;countIn();};}
function countIn(){clearWork();state='ready';$('#pause').disabled=true;overlay.classList.remove('hidden');overlay.innerHTML='<div class="panel"><h2>牽好小豬！</h2><p id="countdown">3</p><p>點選答案房子 · 只有 5 秒！</p></div>';later(()=>$('#countdown').textContent='2',650);later(()=>$('#countdown').textContent='1',1300);later(round,1950);}
function round(){clearWork();state='playing';stage.className='';stage.style.removeProperty('--door');actors();$('#party').style.cssText='';$('#tears').innerHTML='';overlay.classList.add('hidden');$('#pause').disabled=false;const q=game.qs[game.index];$('#equation').textContent=`${q.a} × ${q.b} = ?`;$('#score').textContent=`${game.index} / ${game.qs.length}`;$('#status').textContent='';$('#caption').textContent='點選答案房子，快帶小豬回家！';houses(answerOptions(q));remaining=5000;deadline=performance.now()+remaining;tick();timer=setInterval(tick,40);}
function tick(){if(state!=='playing')return;remaining=Math.max(0,deadline-performance.now());const p=remaining/5000;$('#bar').style.transform=`scaleX(${p})`;$('#seconds').textContent=(remaining/1000).toFixed(1)+' 秒';$('.pig-wrap').style.transform=`scale(${1+(1-p)*1.4})`;if(!remaining)fail('timeout');}
function lock(){clearInterval(timer);document.querySelectorAll('.house').forEach(b=>b.disabled=true);$('#pause').disabled=true;}
function choose(value,door,button){if(state!=='playing')return;if(performance.now()>=deadline){fail('timeout');return;}lock();const q=game.qs[game.index];stage.style.setProperty('--door',door+'%');$('#party').style.left=door+'%';$('#party').style.bottom='28%';$('.pig-wrap').style.transform='scale(1)';button.classList.add('selected');if(value===q.a*q.b){state='success';stage.className='success';$('#status').textContent='答對了！回家囉！';$('#caption').textContent=`${q.a} × ${q.b} = ${q.a*q.b}，安全到家！`;sound('win');later(()=>{game.index++;if(game.index===game.qs.length)finish();else round();},1100);}else{state='approach';later(()=>fail('wrong'),550);}}
function fail(kind){if(!['playing','approach'].includes(state))return;lock();state=kind;game.misses++;$('.pig-wrap').classList.add('crying');if(kind==='wrong'){stage.className='chase';$('#status').textContent='咕咕咕！走錯家啦！';$('#caption').textContent='母雞生氣啦！小豬快跑！';sound('fail');later(()=>{$('#status').textContent='嗚哇——！再選一次！';},1500);later(round,3100);}else{game.timeouts++;stage.className='burst';$('#status').textContent='時間到！眼淚大爆發！';$('#caption').textContent='小豬哭成一片海了！回原點再試一次。';$('#tears').innerHTML=Array.from({length:65},(_,i)=>`<i class="drop" style="left:${i*1.6}%;--size:${14+i%6*8}px;--delay:${-(i%13)*.09}s;--top:${i%10*10}%"></i>`).join('');sound('burst');later(round,2600);}}
function pause(){if(state!=='playing')return;remaining=Math.max(0,deadline-performance.now());clearInterval(timer);state='paused';stage.classList.add('paused');document.querySelectorAll('.house').forEach(b=>b.disabled=true);overlay.classList.remove('hidden');overlay.innerHTML='<div class="panel"><h1>小豬休息中 🐷</h1><p>倒數已暫停。</p><button class="primary" id="resume">繼續找家</button><button id="change" style="margin-top:16px">換名字或乘法表</button></div>';$('#resume').onclick=()=>{overlay.classList.add('hidden');state='playing';stage.classList.remove('paused');deadline=performance.now()+remaining;document.querySelectorAll('.house').forEach(b=>b.disabled=false);tick();timer=setInterval(tick,40);};$('#change').onclick=setup;}
function finish(){clearWork();state='finished';$('#score').textContent=`${game.index} / ${game.qs.length}`;overlay.classList.remove('hidden');overlay.innerHTML=`<div class="panel"><div id="ready-pig">${pig}</div><h1>${safe(prefs.name)}，全部到家！</h1><p>成功帶小豬回家 <b>${game.qs.length}</b> 次！<br>被母雞追了 ${game.misses-game.timeouts} 次<br>眼淚爆發了 ${game.timeouts} 次</p><button class="primary" id="again">再救一次小豬！</button><button id="change" style="margin-top:16px">換名字或乘法表</button></div>`;$('#again').onclick=()=>{game={qs:buildQuestions(prefs.tables),index:0,misses:0,timeouts:0};countIn();};$('#change').onclick=setup;sound('win');}
$('#pause').onclick=pause;$('#sound').onclick=()=>{prefs.sound=!prefs.sound;$('#sound').textContent=prefs.sound?'♪':'靜音';$('#sound').setAttribute('aria-pressed',String(prefs.sound));};$('#sound').textContent=prefs.sound?'♪':'靜音';document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});document.addEventListener('keydown',e=>{if(e.key==='Escape')pause();if(state==='playing'&&['1','2','3'].includes(e.key)){const b=document.querySelectorAll('.house')[+e.key-1];b.click();}});setup();
</script></html>
